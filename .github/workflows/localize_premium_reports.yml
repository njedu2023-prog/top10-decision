name: Localize Premium Reports

on:
  push:
    branches: [main]
    paths:
      - 'scripts/backfill_premium_limitup_truth.py'
      - 'scripts/localize_premium_reports.py'
      - 'scripts/apple_style_premium_reports.py'
      - '.github/workflows/run_premium.yml'
      - '.github/workflows/localize_premium_reports.yml'
  workflow_run:
    workflows: ['Run Premium (Follow Decision)']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: localize-premium-reports
  cancel-in-progress: false

jobs:
  localize:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch'
        || github.event_name == 'push'
        || github.event.workflow_run.conclusion == 'success'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Backfill, rebuild, localize and style Premium reports
        env:
          PYTHONPATH: "${{ github.workspace }}/src"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -e
          python scripts/backfill_premium_limitup_truth.py --verbose
          python scripts/rebuild_premium_reports.py --verbose
          python scripts/localize_premium_reports.py --verbose
          python scripts/apple_style_premium_reports.py --verbose

      - name: Commit localized reports
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add outputs/premium || true
          git add data/market || true
          git add docs/reports/premium_*.html docs/reports/premium_latest.html || true
          if git diff --cached --quiet; then
            echo 'No Premium report localization changes.'
            exit 0
          fi
          git commit -m 'premium: refresh validation truth and styled reports'
          git push origin HEAD:main
