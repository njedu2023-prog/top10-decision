name: Localize Premium Reports

# Manual fallback only.
# The main Premium workflow now backfills, rebuilds, localizes, styles and clarifies reports inline.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: localize-premium-reports
  cancel-in-progress: true

jobs:
  localize:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Backfill, rebuild, localize and style Premium reports
        env:
          PYTHONPATH: "${{ github.workspace }}/src"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -e
          python scripts/backfill_premium_limitup_truth.py --verbose
          python scripts/rebuild_premium_reports.py --verbose
          python scripts/localize_premium_reports.py --verbose
          python scripts/apple_style_premium_reports.py --verbose
          python scripts/clarify_premium_report_metrics.py --verbose

      - name: Commit localized reports
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add outputs/premium || true
          git add data/market || true
          git add docs/reports/premium_*.html docs/reports/premium_latest.html || true
          if git diff --cached --quiet; then
            echo 'No Premium report localization changes.'
            exit 0
          fi
          git commit -m 'premium: refresh validation truth and styled reports'
          git push origin HEAD:main
