name: Validate TopN Targets

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式：backfill=全历史回放；incremental=兼容旧增量验证"
        required: true
        default: "backfill"
        type: choice
        options:
          - backfill
          - incremental
      start_date:
        description: "历史回放起始日期，可空，例如 20260301"
        required: false
        default: ""
      end_date:
        description: "历史回放结束日期，可空，例如 20260504"
        required: false
        default: ""
      d_date:
        description: "兼容旧 incremental 的指定 D 日验证，可空，例如 20260506"
        required: false
        default: ""
      lookback_days:
        description: "兼容旧 incremental 的回看自然日窗口"
        required: false
        default: "30"
      topn:
        description: "TopN 数量"
        required: false
        default: "10"

  schedule:
    # 北京时间 23:02 = UTC 15:02
    # 每日重算 docs/weights 最终排序后验验证，保证页面统计口径稳定。
    - cron: "2 15 * * 1-5"

permissions:
  contents: write

concurrency:
  group: validate-topn-targets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-topn-targets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Show repository status before run
        run: |
          pwd
          ls -la
          echo "Weights files:"
          ls -la docs/weights || true
          echo "Validation dir:"
          ls -la outputs/validation || true
          echo "Validation scripts:"
          ls -la scripts/backfill_topn_targets_validation.py scripts/validate_topn_targets.py || true

      - name: Run TopN Targets validation
        env:
          # 关键修复：
          # schedule 没有 github.event.inputs，必须默认 backfill。
          # 当前主线是 docs/weights/weights_YYYYMMDD.csv 最终排序验证，
          # 不能再让定时任务默认走旧 incremental validate_topn_targets.py。
          MODE: ${{ github.event.inputs.mode || 'backfill' }}
          START_DATE: ${{ github.event.inputs.start_date || '' }}
          END_DATE: ${{ github.event.inputs.end_date || '' }}
          D_DATE: ${{ github.event.inputs.d_date || '' }}
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '30' }}
          TOPN: ${{ github.event.inputs.topn || '10' }}
        run: |
          set -euo pipefail

          echo "MODE=${MODE}"
          echo "START_DATE=${START_DATE}"
          echo "END_DATE=${END_DATE}"
          echo "D_DATE=${D_DATE}"
          echo "LOOKBACK_DAYS=${LOOKBACK_DAYS}"
          echo "TOPN=${TOPN}"

          if [ "${MODE}" = "incremental" ]; then
            echo "[WARN] incremental is kept only for compatibility with the old TopN Targets validator."
            CMD="python scripts/validate_topn_targets.py --topn ${TOPN} --lookback-days ${LOOKBACK_DAYS}"
            if [ -n "${D_DATE}" ]; then
              CMD="${CMD} --d-date ${D_DATE}"
            fi
          else
            CMD="python scripts/backfill_topn_targets_validation.py --topn ${TOPN}"
            if [ -n "${START_DATE}" ]; then
              CMD="${CMD} --start-date ${START_DATE}"
            fi
            if [ -n "${END_DATE}" ]; then
              CMD="${CMD} --end-date ${END_DATE}"
            fi
          fi

          echo "Running: ${CMD}"
          eval "${CMD}"

      - name: Show generated validation outputs
        run: |
          echo "Generated outputs:"
          ls -la outputs/validation || true
          echo "Docs:"
          ls -la docs | grep topn_targets_validation || true
          echo "Summary:"
          cat outputs/validation/topn_targets_validation_summary.md || true

      - name: Commit validation outputs
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add outputs/validation docs/topn_targets_validation.html

          if git diff --cached --quiet; then
            echo "No validation output changes to commit."
            exit 0
          fi

          git commit -m "[validation] update TopN weights validation outputs"

          # 避免连续 workflow / Pages 触发导致 push 冲突：
          # 提交前先 rebase 远端 main，再推送；若仍失败，重试一次。
          git pull --rebase origin main

          if git push origin HEAD:main; then
            echo "Validation outputs pushed."
          else
            echo "[WARN] first push failed, retry after rebase..."
            git pull --rebase origin main
            git push origin HEAD:main
          fi
