name: Validate TopN Targets

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式：backfill=全历史回放；incremental=最近窗口增量验证"
        required: true
        default: "backfill"
        type: choice
        options:
          - backfill
          - incremental
      start_date:
        description: "历史回放起始 D 日，可空，例如 20260301"
        required: false
        default: ""
      end_date:
        description: "历史回放结束 D 日，可空，例如 20260504"
        required: false
        default: ""
      d_date:
        description: "指定单个 D 日验证，可空，例如 20260506"
        required: false
        default: ""
      lookback_days:
        description: "incremental 模式回看自然日窗口"
        required: false
        default: "30"
      topn:
        description: "TopN 数量"
        required: false
        default: "10"

  schedule:
    # 北京时间 23:02 = UTC 15:02
    # 用于每日晚间验证最近成熟的 TopN Targets，尽量等待上游行情/快照落库完成
    - cron: "2 15 * * 1-5"

permissions:
  contents: write

jobs:
  validate-topn-targets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Show repository status before run
        run: |
          pwd
          ls -la
          echo "Decision files:"
          ls -la data/decision || true
          echo "Validation dir:"
          ls -la outputs/validation || true

      - name: Run TopN Targets validation
        env:
          MODE: ${{ github.event.inputs.mode || 'incremental' }}
          START_DATE: ${{ github.event.inputs.start_date || '' }}
          END_DATE: ${{ github.event.inputs.end_date || '' }}
          D_DATE: ${{ github.event.inputs.d_date || '' }}
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '30' }}
          TOPN: ${{ github.event.inputs.topn || '10' }}
        run: |
          set -e

          echo "MODE=${MODE}"
          echo "START_DATE=${START_DATE}"
          echo "END_DATE=${END_DATE}"
          echo "D_DATE=${D_DATE}"
          echo "LOOKBACK_DAYS=${LOOKBACK_DAYS}"
          echo "TOPN=${TOPN}"

          if [ "${MODE}" = "backfill" ]; then
            CMD="python scripts/backfill_topn_targets_validation.py --topn ${TOPN}"
            if [ -n "${START_DATE}" ]; then
              CMD="${CMD} --start-date ${START_DATE}"
            fi
            if [ -n "${END_DATE}" ]; then
              CMD="${CMD} --end-date ${END_DATE}"
            fi
            echo "Running: ${CMD}"
            eval "${CMD}"
          else
            CMD="python scripts/validate_topn_targets.py --topn ${TOPN} --lookback-days ${LOOKBACK_DAYS}"
            if [ -n "${D_DATE}" ]; then
              CMD="${CMD} --d-date ${D_DATE}"
            fi
            echo "Running: ${CMD}"
            eval "${CMD}"
          fi

      - name: Show generated validation outputs
        run: |
          echo "Generated outputs:"
          ls -la outputs/validation || true
          echo "Docs:"
          ls -la docs | grep topn_targets_validation || true
          echo "Summary:"
          cat outputs/validation/topn_targets_validation_summary.md || true

      - name: Commit validation outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add outputs/validation docs/topn_targets_validation.html

          if git diff --cached --quiet; then
            echo "No validation output changes to commit."
          else
            git commit -m "[validation] update TopN Targets validation outputs"
            git push
          fi
