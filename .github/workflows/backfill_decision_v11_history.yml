name: Backfill Decision Two-Year History

on:
  schedule:
    # Sunday 10:30 Beijing. Keep 500 OOS sessions plus conservative warmup complete.
    - cron: "30 2 * * 0"
  workflow_dispatch:
    inputs:
      start_date:
        description: "历史起始日 YYYYMMDD"
        required: false
        default: "20200101"
        type: string
      end_date:
        description: "历史结束日 YYYYMMDD（留空=北京时间今天）"
        required: false
        type: string
      max_missing_dates:
        description: "本次最多新增历史信号日"
        required: false
        default: "500"
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

concurrency:
  group: decision-auction-main-writer
  cancel-in-progress: false

jobs:
  backfill:
    name: Build strict-calendar compact history
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: requirements-decision.lock.txt

      - name: Install dependencies
        run: |
          set -e
          python -m pip install pip==26.2.1
          pip install -r requirements-decision.lock.txt

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=${GITHUB_WORKSPACE}/src" >> "$GITHUB_ENV"

      - name: Resolve bounded history request
        id: request
        env:
          INPUT_START: ${{ inputs.start_date }}
          INPUT_END: ${{ inputs.end_date }}
          INPUT_MAX: ${{ inputs.max_missing_dates }}
        run: |
          set -e
          start="${INPUT_START:-20200101}"
          end="${INPUT_END:-$(TZ=Asia/Shanghai date +%Y%m%d)}"
          maximum="${INPUT_MAX:-500}"
          echo "${start}" | grep -Eq '^[0-9]{8}$'
          echo "${end}" | grep -Eq '^[0-9]{8}$'
          echo "${maximum}" | grep -Eq '^[0-9]+$'
          test "${maximum}" -ge 1
          test "${maximum}" -le 500
          echo "start_date=${start}" >> "$GITHUB_OUTPUT"
          echo "end_date=${end}" >> "$GITHUB_OUTPUT"
          echo "max_missing_dates=${maximum}" >> "$GITHUB_OUTPUT"

      - name: Backfill immutable Decision history
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          set -e
          python scripts/backfill_decision_v11_history.py \
            --start-date "${{ steps.request.outputs.start_date }}" \
            --end-date "${{ steps.request.outputs.end_date }}" \
            --max-missing-dates "${{ steps.request.outputs.max_missing_dates }}"

      - name: Run Decision history and autonomy tests
        run: |
          set -e
          python -m unittest discover -s tests -p 'test_decision_contract.py' -v
          python -m unittest discover -s tests -p 'test_decision_model_freeze.py' -v
          python -m unittest discover -s tests -p 'test_decision_autonomy.py' -v

      - name: Validate strict-calendar immutable history
        run: |
          set -e
          python scripts/validate_decision_history_backfill.py

      - name: Commit Decision-only immutable history
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/auction_v3/history
          git add data/market/trade_cal_sse.csv
          if git diff --cached --quiet; then
            echo "Decision two-year history is already current"
            exit 0
          fi
          git commit -m "auto: extend Decision two-year history"
          pushed=0
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              pushed=1
              break
            fi
            git rebase --abort || true
            sleep 3
          done
          test "${pushed}" = "1"
