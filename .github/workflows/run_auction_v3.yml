name: Run Decision Top10 Trade Selector V12

on:
  schedule:
    # Independent recovery runs: 23:30 and 08:15 Beijing on weekdays.
    - cron: "30 15 * * 1-5"
    - cron: "15 0 * * 1-5"
  push:
    branches: [main]
    paths:
      - ".github/workflows/run_auction_v3.yml"
      - "requirements-decision.lock.txt"
      - "models/decision_model_freeze.json"
      - "src/top10decision/auction_v3/**"
      - "src/top10decision/decision/**"
      - "src/top10decision/data/**"
      - "scripts/run_auction_v3.py"
      - "scripts/validate_decision_model_freeze.py"
      - "scripts/validate_decision_publication.py"
      - "scripts/validate_io_contract.py"
      - "scripts/sync_tushare_minute.py"
      - "scripts/backfill_decision_v11_history.py"
      - "scripts/publish_decision_action.py"
      - "scripts/verify_decision_observations.py"
      - "tests/test_auction_v3.py"
      - "tests/test_decision_contract.py"
      - "tests/test_decision_model_freeze.py"
      - "tests/test_decision_autonomy.py"
      - "tests/test_decision_v8_calibration.py"
      - "tests/test_decision_trade_selector.py"
  workflow_run:
    workflows: ["Run Top10 Decision (Auto Daily)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      signal_date:
        description: "信号日 YYYYMMDD（留空=最新冻结候选）"
        required: false
        type: string
      order_amount:
        description: "单票计划金额（元），用于竞价容量校验"
        required: false
        default: "100000"
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

concurrency:
  group: decision-auction-main-writer
  cancel-in-progress: false

jobs:
  auction_guidance_v12:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'schedule' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: requirements-decision.lock.txt

      - name: Install dependencies
        run: |
          set -e
          python -m pip install pip==26.2.1
          pip install -r requirements-decision.lock.txt

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=${GITHUB_WORKSPACE}/src" >> "$GITHUB_ENV"

      - name: Validate frozen Decision production model
        run: |
          set -e
          python scripts/validate_decision_model_freeze.py

      - name: Run Decision execution tests
        run: |
          set -e
          python -m unittest discover -s tests -p 'test_auction_v3.py' -v
          python -m unittest discover -s tests -p 'test_decision_v8_calibration.py' -v
          python -m unittest discover -s tests -p 'test_decision_trade_selector.py' -v
          python -m unittest discover -s tests -p 'test_decision_contract.py' -v
          python -m unittest discover -s tests -p 'test_decision_model_freeze.py' -v
          python -m unittest discover -s tests -p 'test_decision_autonomy.py' -v
          python -m unittest discover -s tests -p 'test_premium_safety.py' -v

      - name: Sync strict calendar and Tushare minute truth
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          SIGNAL_DATE: ${{ inputs.signal_date }}
        run: |
          set -e
          args=(--optional --max-codes 80 --timeout-seconds 8 --workers 6)
          if [ -n "${SIGNAL_DATE}" ]; then
            args+=(--signal-date "${SIGNAL_DATE}")
          fi
          python scripts/sync_tushare_minute.py "${args[@]}"

      - name: Gate scheduled recovery on strict A-share calendar
        id: calendar_gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -e
          if [ "${EVENT_NAME}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          today="$(TZ=Asia/Shanghai date +%Y%m%d)"
          set +e
          python scripts/verify_decision_observations.py --check-trading-date "${today}"
          status=$?
          set -e
          if [ "${status}" = "0" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "${status}" = "3" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skip scheduled recovery: ${today} is not an A-share trading day"
          else
            exit "${status}"
          fi

      - name: Run Decision Top10 trade selector V12
        if: steps.calendar_gate.outputs.run == 'true'
        env:
          SIGNAL_DATE: ${{ inputs.signal_date }}
          ORDER_AMOUNT: ${{ inputs.order_amount || '100000' }}
        run: |
          set -e
          args=(--order-amount "${ORDER_AMOUNT}")
          if [ -n "${SIGNAL_DATE}" ]; then
            if ! echo "${SIGNAL_DATE}" | grep -Eq '^[0-9]{8}$'; then
              echo "invalid signal_date=${SIGNAL_DATE}"
              exit 1
            fi
            args+=(--signal-date "${SIGNAL_DATE}")
          fi
          succeeded=0
          for attempt in 1 2 3; do
            if python scripts/run_auction_v3.py "${args[@]}"; then
              succeeded=1
              break
            fi
            echo "Decision selector attempt ${attempt} failed; retrying deterministically"
            sleep $((attempt * 5))
          done
          test "${succeeded}" = "1"

      - name: Upload fail-closed runtime diagnostics
        if: failure() && steps.calendar_gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: decision-runtime-drift-${{ github.run_id }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            outputs/auction_v3/models/model_meta_latest.json
            outputs/auction_v3/metrics/backtest_latest.json
            outputs/auction_v3/metrics/backtest_trade_selector_oos_latest.csv
            outputs/auction_v3/predictions/pred_latest.csv

      - name: Publish unified Decision action plan
        if: steps.calendar_gate.outputs.run == 'true'
        run: |
          set -e
          python scripts/publish_decision_action.py

      - name: Verify frozen runtime fingerprints
        if: steps.calendar_gate.outputs.run == 'true'
        run: |
          set -e
          python scripts/validate_decision_model_freeze.py --runtime

      - name: Validate generated contract
        if: steps.calendar_gate.outputs.run == 'true'
        run: |
          set -e
          test -f outputs/auction_v3/predictions/pred_latest.csv
          test -f outputs/auction_v3/metrics/backtest_latest.json
          test -f outputs/auction_v3/metrics/backtest_gate_audit_latest.csv
          test -f outputs/auction_v3/metrics/backtest_shadow_latest.csv
          test -f outputs/auction_v3/metrics/backtest_stage_focus_all_latest.csv
          test -f outputs/auction_v3/metrics/backtest_path_focus_latest.csv
          test -f outputs/auction_v3/metrics/backtest_top10_latest.csv
          test -f outputs/auction_v3/metrics/backtest_trade_selector_oos_latest.csv
          test -f outputs/auction_v3/metrics/backtest_trade_selector_selected_latest.csv
          test -f outputs/auction_v3/metrics/cumulative_latest.json
          test -f outputs/auction_v3/metrics/observation_cumulative_latest.json
          test -f outputs/auction_v3/verification/observation_latest.csv
          test -f docs/reports/auction_v3_latest.html
          test -f docs/reports/auction_v3_verify_latest.html
          test -f docs/reports/auction_v3_validation_dashboard.html
          test -f outputs/decision/action_plan_latest.json
          test -f outputs/decision/report_index.json
          python -m json.tool outputs/auction_v3/metrics/backtest_latest.json >/dev/null
          python -m json.tool outputs/auction_v3/metrics/cumulative_latest.json >/dev/null
          python -m json.tool outputs/auction_v3/metrics/observation_cumulative_latest.json >/dev/null
          python -m json.tool outputs/decision/action_plan_latest.json >/dev/null
          python -m json.tool outputs/decision/report_index.json >/dev/null
          python scripts/validate_io_contract.py --strict-semantic
          python scripts/validate_decision_publication.py

      - name: Commit frozen predictions, truth and reports
        if: steps.calendar_gate.outputs.run == 'true'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A outputs/auction_v3
          git add outputs/decision/action_plan_*.json outputs/decision/report_index.json
          git add models/decision_v12_frozen_history_20260805.csv.gz || true
          git add data/market/trade_cal_sse.csv || true
          git add -A data/market/minute_1m || true
          find data/market/raw -type f \
            \( -name 'stk_auction_o.csv' -o -name 'stk_auction_o.meta.json' \) \
            -print0 | xargs -0 -r git add --
          git add docs/reports/auction_v3*.html
          if git diff --cached --quiet; then
            echo "Decision V12 has no changed artifacts"
            exit 0
          fi
          git commit -m "auto: update Decision V12 trade selector and validation"
          pushed=0
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              pushed=1
              break
            fi
            git rebase --abort || true
            sleep 3
          done
          test "${pushed}" = "1"
