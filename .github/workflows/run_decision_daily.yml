name: Run Top10 Decision (Auto Daily)

on:
  schedule:
    - cron: "15 13 * * 1-5"
  workflow_dispatch:
    inputs:
      trade_date:
        description: "手动指定交易日 YYYYMMDD（Decision: 留空=使用 a-top10 decisio latest；Learning: 留空=自动选择已成熟 trade_date）"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: top10-decision-daily
  cancel-in-progress: false

jobs:
  decision:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=${GITHUB_WORKSPACE}/src" >> "$GITHUB_ENV"

      - name: Ensure output dirs
        run: |
          set -e
          mkdir -p data/pred data/pred/archive data/market data/market/raw data/decision
          mkdir -p docs/signals docs/reports docs/weights
          mkdir -p outputs/decision outputs/learning models

      - name: Sync pred source snapshot (to data/pred/pred_source_latest.csv)
        env:
          TRADE_DATE: ${{ inputs.trade_date }}
          A_TOP10_OWNER: njedu2023-prog
          A_TOP10_REPO: a-top10
          A_TOP10_BRANCH: main
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${TRADE_DATE}" ]; then
            if ! echo "${TRADE_DATE}" | grep -E '^[0-9]{8}$' >/dev/null; then
              echo "[sync-pred] invalid trade_date: ${TRADE_DATE} (expect YYYYMMDD)"
              exit 1
            fi
            FILE_IN_A_TOP10="outputs/decisio/pred_decisio_${TRADE_DATE}.csv"
            RAW_URL="https://raw.githubusercontent.com/${A_TOP10_OWNER}/${A_TOP10_REPO}/${A_TOP10_BRANCH}/${FILE_IN_A_TOP10}"
            TRADE_DATE="${TRADE_DATE}" TOP10_PRED_URL="${RAW_URL}" python scripts/sync_pred_source.py
          else
            RAW_URL="https://raw.githubusercontent.com/njedu2023-prog/a-top10/main/outputs/decisio/pred_decisio_latest.csv"
            TOP10_PRED_URL="${RAW_URL}" python scripts/sync_pred_source.py
          fi

      - name: Sync market raw snapshots
        env:
          TRADE_DATE: ${{ inputs.trade_date }}
          MARKET_RAW_OWNER: njedu2023-prog
          MARKET_RAW_REPO: a-share-top3-data
          MARKET_RAW_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${TRADE_DATE}" ]; then
            python scripts/sync_market_raw.py --trade-date "${TRADE_DATE}"
          else
            python scripts/sync_market_raw.py
          fi

      - name: Build market FS
        env:
          TRADE_DATE: ${{ inputs.trade_date }}
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${TRADE_DATE}" ]; then
            python scripts/build_market_fs.py --trade-date "${TRADE_DATE}"
          else
            python scripts/build_market_fs.py
          fi

      - name: Run decision pipeline (V2 orchestrator)
        env:
          TRADE_DATE: ${{ inputs.trade_date }}
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${TRADE_DATE}" ]; then
            python scripts/run_v2.py --trade-date "${TRADE_DATE}"
          else
            python scripts/run_v2.py
          fi

      - name: Validate IO contract (must pass)
        run: |
          set -e
          python scripts/validate_io_contract.py

  pfill_learning:
    needs: decision
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reset to latest remote main
        run: |
          set -e
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=${GITHUB_WORKSPACE}/src" >> "$GITHUB_ENV"

      - name: Ensure learning dirs
        run: |
          set -e
          mkdir -p data/pred data/pred/archive data/market outputs/learning models

      - name: Resolve current run date
        id: resolve_current_run_date
        env:
          TRADE_DATE_INPUT: ${{ inputs.trade_date }}
        run: |
          set -e
          if [ -n "${TRADE_DATE_INPUT}" ]; then
            CURRENT_RUN_DATE="${TRADE_DATE_INPUT}"
          else
            CURRENT_RUN_DATE="$(find data/market/raw -type d -regextype posix-extended -regex '.*/[0-9]{8}$' -printf '%f\n' 2>/dev/null | sort | tail -n 1)"
          fi
          if echo "${CURRENT_RUN_DATE}" | grep -E '^[0-9]{8}$' >/dev/null; then
            echo "current_run_date=${CURRENT_RUN_DATE}" >> "$GITHUB_OUTPUT"
            echo "has_current_run_date=true" >> "$GITHUB_OUTPUT"
          else
            echo "current_run_date=" >> "$GITHUB_OUTPUT"
            echo "has_current_run_date=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build candidate trade_date list for maturity resolver
        if: steps.resolve_current_run_date.outputs.has_current_run_date == 'true'
        run: |
          cat > /tmp/build_candidate_trade_dates.py <<'PY'
          from pathlib import Path
          import csv
          import re

          out_path = Path("data/market/sample_maturity_candidates.csv")
          out_path.parent.mkdir(parents=True, exist_ok=True)

          candidates = set()

          market_dir = Path("data/market")
          for p in market_dir.glob("features_limit_*.csv"):
              m = re.fullmatch(r"features_limit_(\d{8})\.csv", p.name)
              if m:
                  candidates.add(m.group(1))

          pred_archive = Path("data/pred/archive")
          if pred_archive.exists():
              for p in pred_archive.rglob("*.csv"):
                  m = re.search(r"(\d{8})", p.name)
                  if m:
                      candidates.add(m.group(1))

          rows = sorted(candidates)

          with out_path.open("w", encoding="utf-8-sig", newline="") as f:
              writer = csv.DictWriter(f, fieldnames=["trade_date", "candidate_type"])
              writer.writeheader()
              for td in rows:
                  writer.writerow({"trade_date": td, "candidate_type": "PFILL_ERET"})

          print(f"[learning] candidate trade_dates={len(rows)}")
          print(f"[learning] candidate file={out_path}")
          PY
          python /tmp/build_candidate_trade_dates.py
          cat data/market/sample_maturity_candidates.csv || true

      - name: Resolve sample maturity
        if: steps.resolve_current_run_date.outputs.has_current_run_date == 'true'
        run: |
          set -e
          python scripts/resolve_sample_maturity.py             --current-run-date "${{ steps.resolve_current_run_date.outputs.current_run_date }}"             --raw-root "data/market/raw"             --trade-dates-file "data/market/sample_maturity_candidates.csv"             --trade-date-column "trade_date"             --output-csv "data/market/sample_maturity_latest.csv"             --output-json "data/market/sample_maturity_latest.json"

      - name: Resolve P_fill learning target (missing-first, safe fallback)
        id: resolve_pfill_learning_td
        if: steps.resolve_current_run_date.outputs.has_current_run_date == 'true'
        run: |
          cat > /tmp/resolve_pfill_learning_td.py <<'PY'
          from pathlib import Path
          import csv
          import json
          import os

          maturity_path = Path("data/market/sample_maturity_latest.csv")
          meta_path = Path("models/pfill_meta.json")

          ready_dates = []
          if maturity_path.exists():
              with maturity_path.open("r", encoding="utf-8-sig", newline="") as f:
                  reader = csv.DictReader(f)
                  for row in reader:
                      td = (row.get("trade_date") or "").strip()
                      ready = (row.get("PFILL_READY") or "").strip()
                      if td and ready == "1":
                          ready_dates.append(td)
          ready_dates = sorted(set(ready_dates))

          missing_dates = []
          if meta_path.exists():
              try:
                  meta = json.loads(meta_path.read_text(encoding="utf-8"))
                  missing_dates = sorted(set(meta.get("missing_trade_dates") or []))
              except Exception:
                  missing_dates = []

          preferred_missing = ""
          repairable_missing = [td for td in missing_dates if td in ready_dates]
          if repairable_missing:
              preferred_missing = repairable_missing[-1]

          latest_ready = ready_dates[-1] if ready_dates else ""

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"preferred_missing_trade_date={preferred_missing}\n")
              f.write(f"latest_ready_trade_date={latest_ready}\n")
              f.write(f"has_any_ready={'true' if latest_ready else 'false'}\n")

          print(f"[pfill-resolve] preferred_missing_trade_date={preferred_missing}")
          print(f"[pfill-resolve] latest_ready_trade_date={latest_ready}")
          PY
          python /tmp/resolve_pfill_learning_td.py

      - name: Select P_fill learning trade_date
        id: select_pfill_learning_td
        if: steps.resolve_pfill_learning_td.outputs.has_any_ready == 'true'
        env:
          PREFERRED_MISSING_TD: ${{ steps.resolve_pfill_learning_td.outputs.preferred_missing_trade_date }}
          LATEST_READY_TD: ${{ steps.resolve_pfill_learning_td.outputs.latest_ready_trade_date }}
          A_TOP10_OWNER: njedu2023-prog
          A_TOP10_REPO: a-top10
          A_TOP10_BRANCH: main
        run: |
          set -e
          pick_td=""
          pick_reason=""
          pick_url=""

          choose_candidate() {
            local TD="$1"
            local REASON="$2"
            if [ -z "${TD}" ]; then
              return 1
            fi
            if ! echo "${TD}" | grep -E '^[0-9]{8}$' >/dev/null; then
              return 1
            fi
            local LOCAL_ARCHIVE="data/pred/archive/pred_source_${TD}.csv"
            local FILE_IN_A_TOP10="outputs/decisio/pred_decisio_${TD}.csv"
            local RAW_URL="https://raw.githubusercontent.com/${A_TOP10_OWNER}/${A_TOP10_REPO}/${A_TOP10_BRANCH}/${FILE_IN_A_TOP10}"
            if [ -f "${LOCAL_ARCHIVE}" ]; then
              pick_td="${TD}"
              pick_reason="${REASON}_local_archive"
              pick_url="${RAW_URL}"
              return 0
            fi
            if curl -fsI "${RAW_URL}" >/dev/null 2>&1; then
              pick_td="${TD}"
              pick_reason="${REASON}_remote_available"
              pick_url="${RAW_URL}"
              return 0
            fi
            return 1
          }

          choose_candidate "${PREFERRED_MISSING_TD}" "missing_backfill" || choose_candidate "${LATEST_READY_TD}" "latest_ready" || true

          if [ -n "${pick_td}" ]; then
            echo "trade_date=${pick_td}" >> "$GITHUB_OUTPUT"
            echo "trade_reason=${pick_reason}" >> "$GITHUB_OUTPUT"
            echo "pred_url=${pick_url}" >> "$GITHUB_OUTPUT"
            echo "has_trade_date=true" >> "$GITHUB_OUTPUT"
          else
            echo "trade_date=" >> "$GITHUB_OUTPUT"
            echo "trade_reason=" >> "$GITHUB_OUTPUT"
            echo "pred_url=" >> "$GITHUB_OUTPUT"
            echo "has_trade_date=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync pred source snapshot for P_fill trade_date
        if: steps.select_pfill_learning_td.outputs.has_trade_date == 'true'
        env:
          TRADE_DATE: ${{ steps.select_pfill_learning_td.outputs.trade_date }}
          TOP10_PRED_URL: ${{ steps.select_pfill_learning_td.outputs.pred_url }}
        run: |
          set -e
          TRADE_DATE="${TRADE_DATE}" TOP10_PRED_URL="${TOP10_PRED_URL}" python scripts/sync_pred_source.py

      - name: Build fill truth
        if: steps.select_pfill_learning_td.outputs.has_trade_date == 'true'
        run: python scripts/build_fill_truth.py --trade-date "${{ steps.select_pfill_learning_td.outputs.trade_date }}"

      - name: Build P_fill trainset
        if: steps.select_pfill_learning_td.outputs.has_trade_date == 'true'
        run: python scripts/build_pfill_trainset.py --trade-date "${{ steps.select_pfill_learning_td.outputs.trade_date }}"

      - name: Train P_fill models
        if: steps.select_pfill_learning_td.outputs.has_trade_date == 'true'
        run: python scripts/train_pfill.py --trade-date "${{ steps.select_pfill_learning_td.outputs.trade_date }}"

      - name: Resolve E_ret learning target (missing-first, safe fallback)
        id: resolve_eret_learning_td
        if: steps.resolve_current_run_date.outputs.has_current_run_date == 'true'
        run: |
          cat > /tmp/resolve_eret_learning_td.py <<'PY'
          from pathlib import Path
          import csv
          import json
          import os

          maturity_path = Path("data/market/sample_maturity_latest.csv")
          meta_path = Path("models/eret_meta.json")

          ready_dates = []
          if maturity_path.exists():
              with maturity_path.open("r", encoding="utf-8-sig", newline="") as f:
                  reader = csv.DictReader(f)
                  for row in reader:
                      td = (row.get("trade_date") or "").strip()
                      ready = (row.get("ERET_READY") or "").strip()
                      if td and ready == "1":
                          ready_dates.append(td)
          ready_dates = sorted(set(ready_dates))

          missing_dates = []
          if meta_path.exists():
              try:
                  meta = json.loads(meta_path.read_text(encoding="utf-8"))
                  missing_dates = sorted(set(meta.get("missing_trade_dates") or []))
              except Exception:
                  missing_dates = []

          preferred_missing = ""
          repairable_missing = [td for td in missing_dates if td in ready_dates]
          if repairable_missing:
              preferred_missing = repairable_missing[-1]

          latest_ready = ready_dates[-1] if ready_dates else ""

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"preferred_missing_trade_date={preferred_missing}\n")
              f.write(f"latest_ready_trade_date={latest_ready}\n")
              f.write(f"has_any_ready={'true' if latest_ready else 'false'}\n")

          print(f"[eret-resolve] preferred_missing_trade_date={preferred_missing}")
          print(f"[eret-resolve] latest_ready_trade_date={latest_ready}")
          PY
          python /tmp/resolve_eret_learning_td.py

      - name: Select E_ret learning trade_date
        id: select_eret_learning_td
        if: steps.resolve_eret_learning_td.outputs.has_any_ready == 'true'
        env:
          PREFERRED_MISSING_TD: ${{ steps.resolve_eret_learning_td.outputs.preferred_missing_trade_date }}
          LATEST_READY_TD: ${{ steps.resolve_eret_learning_td.outputs.latest_ready_trade_date }}
          A_TOP10_OWNER: njedu2023-prog
          A_TOP10_REPO: a-top10
          A_TOP10_BRANCH: main
        run: |
          set -e
          pick_td=""
          pick_reason=""
          pick_url=""

          choose_candidate() {
            local TD="$1"
            local REASON="$2"
            if [ -z "${TD}" ]; then
              return 1
            fi
            if ! echo "${TD}" | grep -E '^[0-9]{8}$' >/dev/null; then
              return 1
            fi
            local LOCAL_ARCHIVE="data/pred/archive/pred_source_${TD}.csv"
            local FILE_IN_A_TOP10="outputs/decisio/pred_decisio_${TD}.csv"
            local RAW_URL="https://raw.githubusercontent.com/${A_TOP10_OWNER}/${A_TOP10_REPO}/${A_TOP10_BRANCH}/${FILE_IN_A_TOP10}"
            if [ -f "${LOCAL_ARCHIVE}" ]; then
              pick_td="${TD}"
              pick_reason="${REASON}_local_archive"
              pick_url="${RAW_URL}"
              return 0
            fi
            if curl -fsI "${RAW_URL}" >/dev/null 2>&1; then
              pick_td="${TD}"
              pick_reason="${REASON}_remote_available"
              pick_url="${RAW_URL}"
              return 0
            fi
            return 1
          }

          choose_candidate "${PREFERRED_MISSING_TD}" "missing_backfill" || choose_candidate "${LATEST_READY_TD}" "latest_ready" || true

          if [ -n "${pick_td}" ]; then
            echo "trade_date=${pick_td}" >> "$GITHUB_OUTPUT"
            echo "trade_reason=${pick_reason}" >> "$GITHUB_OUTPUT"
            echo "pred_url=${pick_url}" >> "$GITHUB_OUTPUT"
            echo "has_trade_date=true" >> "$GITHUB_OUTPUT"
          else
            echo "trade_date=" >> "$GITHUB_OUTPUT"
            echo "trade_reason=" >> "$GITHUB_OUTPUT"
            echo "pred_url=" >> "$GITHUB_OUTPUT"
            echo "has_trade_date=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync pred source snapshot for E_ret trade_date
        if: steps.select_eret_learning_td.outputs.has_trade_date == 'true'
        env:
          TRADE_DATE: ${{ steps.select_eret_learning_td.outputs.trade_date }}
          TOP10_PRED_URL: ${{ steps.select_eret_learning_td.outputs.pred_url }}
        run: |
          set -e
          TRADE_DATE="${TRADE_DATE}" TOP10_PRED_URL="${TOP10_PRED_URL}" python scripts/sync_pred_source.py

      - name: Build fill truth for E_ret trade_date
        if: steps.select_eret_learning_td.outputs.has_trade_date == 'true'
        run: python scripts/build_fill_truth.py --trade-date "${{ steps.select_eret_learning_td.outputs.trade_date }}"

      - name: Build E_ret truth
        if: steps.select_eret_learning_td.outputs.has_trade_date == 'true'
        run: python scripts/build_eret_truth.py --trade-date "${{ steps.select_eret_learning_td.outputs.trade_date }}"

      - name: Build E_ret trainset
        if: steps.select_eret_learning_td.outputs.has_trade_date == 'true'
        run: python scripts/build_eret_trainset.py --trade-date "${{ steps.select_eret_learning_td.outputs.trade_date }}"

      - name: Train E_ret models
        if: steps.select_eret_learning_td.outputs.has_trade_date == 'true'
        run: python scripts/train_eret.py --trade-date "${{ steps.select_eret_learning_td.outputs.trade_date }}"
