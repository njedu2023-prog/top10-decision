name: Run Top10 Decision (Auto Daily)

on:
  schedule:
    # Mon-Fri 21:15 Beijing (UTC+8) == 13:15 UTC
    - cron: "15 13 * * 1-5"
  workflow_dispatch:
    inputs:
      trade_date:
        description: "手动指定交易日 YYYYMMDD（留空=自动使用最新 raw/pred 快照）"
        required: false
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: top10-decision-daily
  cancel-in-progress: false

jobs:
  decision_initial:
    name: Build FS and Initial Decision
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=${GITHUB_WORKSPACE}/src" >> "$GITHUB_ENV"

      - name: Ensure output dirs
        run: |
          set -e
          mkdir -p data/pred data/pred/archive
          mkdir -p data/market data/market/raw
          mkdir -p data/decision
          mkdir -p docs/signals docs/reports docs/weights
          mkdir -p outputs/decision outputs/learning
          mkdir -p models

      - name: Sync pred source snapshot
        env:
          TRADE_DATE: ${{ inputs.trade_date }}
          A_TOP10_OWNER: njedu2023-prog
          A_TOP10_REPO: a-top10
          A_TOP10_BRANCH: main
        run: |
          set -e

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${TRADE_DATE}" ]; then
            echo "[sync-pred] manual trade_date=${TRADE_DATE}"
            if ! echo "${TRADE_DATE}" | grep -E '^[0-9]{8}$' >/dev/null; then
              echo "[sync-pred] invalid trade_date=${TRADE_DATE} (expect YYYYMMDD)"
              exit 1
            fi
            FILE_IN_A_TOP10="outputs/decisio/pred_decisio_${TRADE_DATE}.csv"
            RAW_URL="https://raw.githubusercontent.com/${A_TOP10_OWNER}/${A_TOP10_REPO}/${A_TOP10_BRANCH}/${FILE_IN_A_TOP10}"
            TRADE_DATE="${TRADE_DATE}" TOP10_PRED_URL="${RAW_URL}" python scripts/sync_pred_source.py
          else
            RAW_URL="https://raw.githubusercontent.com/njedu2023-prog/a-top10/main/outputs/decisio/pred_decisio_latest.csv"
            TOP10_PRED_URL="${RAW_URL}" python scripts/sync_pred_source.py
          fi

          echo "[sync-pred] generated:"
          ls -lah data/pred || true
          find data/pred -maxdepth 3 -type f | sort || true

      - name: Sync market raw snapshots
        env:
          TRADE_DATE: ${{ inputs.trade_date }}
          MARKET_RAW_OWNER: njedu2023-prog
          MARKET_RAW_REPO: a-share-top3-data
          MARKET_RAW_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${TRADE_DATE}" ]; then
            echo "[sync-market-raw] manual trade_date=${TRADE_DATE}"
            python scripts/sync_market_raw.py --trade-date "${TRADE_DATE}"
          else
            echo "[sync-market-raw] auto mode"
            python scripts/sync_market_raw.py
          fi

          echo "[sync-market-raw] dirs:"
          find data/market/raw -maxdepth 3 -type d | sort || true
          echo "[sync-market-raw] files:"
          find data/market/raw -maxdepth 3 -type f | sort || true

      - name: Build market FS
        env:
          TRADE_DATE: ${{ inputs.trade_date }}
        run: |
          set -e
          echo "[fs] precheck raw files:"
          find data/market/raw -maxdepth 3 -type f | sort || true

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${TRADE_DATE}" ]; then
            echo "[fs] manual trade_date=${TRADE_DATE}"
            python scripts/build_market_fs.py --trade-date "${TRADE_DATE}"
          else
            echo "[fs] auto latest raw snapshot"
            python scripts/build_market_fs.py
          fi

          echo "[fs] generated market files:"
          ls -lah data/market || true

      - name: Run decision pipeline before learning
        env:
          TRADE_DATE: ${{ inputs.trade_date }}
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${TRADE_DATE}" ]; then
            echo "[run_v2-initial] manual trade_date=${TRADE_DATE}"
            python scripts/run_v2.py --trade-date "${TRADE_DATE}"
          else
            echo "[run_v2-initial] auto mode"
            python scripts/run_v2.py
          fi

      - name: Validate IO contract
        run: |
          set -e
          python scripts/validate_io_contract.py

      - name: Commit initial decision outputs
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          find . -type d -name "__pycache__" -prune -exec rm -rf {} + || true
          find . -type f -name "*.pyc" -delete || true
          mkdir -p .git/info
          grep -qxF "__pycache__/" .git/info/exclude 2>/dev/null || echo "__pycache__/" >> .git/info/exclude
          grep -qxF "*.pyc" .git/info/exclude 2>/dev/null || echo "*.pyc" >> .git/info/exclude

          git add data/pred/pred_source_latest.csv || true
          git add data/pred/archive/*.csv || true
          git add -A data/pred/archive || true
          git add data/pred/pred_top10_latest.csv || true
          git add data/pred/pred_top10_*.csv || true
          git add -A data/market/raw || true
          git add data/market/features_base_*.csv || true
          git add data/market/features_limit_*.csv || true
          git add data/market/truth_close_*.csv || true
          git add data/market/_meta_*.json || true
          git add docs/weights/weights_latest.csv || true
          git add docs/weights/weights_*.csv || true
          git add outputs/decision/* || true
          git add outputs/decision/**/*.md || true
          git add outputs/decision/**/*.json || true
          git add data/decision/decision_candidates_*.csv || true
          git add data/decision/decision_execution_*.csv || true
          git add data/decision/decision_learning.csv || true
          git add docs/signals/top10_latest.csv || true
          git add docs/signals/top10_*.csv || true
          git add docs/signals/TopEVR_latest.csv || true
          git add docs/signals/TopEVR_*.csv || true
          git add docs/reports/*.md || true
          git add -A docs/reports || true

          echo "[git-initial] status after add:"
          git status --porcelain | sed -n '1,200p' || true

          if git diff --cached --quiet; then
            echo "[git-initial] no staged changes"
            exit 0
          fi

          git commit -m "auto: sync market raw, build fs, update decision outputs"

          if [ -n "$(git status --porcelain)" ]; then
            git reset --hard HEAD
          fi

          pushed=0
          for attempt in 1 2 3; do
            echo "[push-initial] attempt=${attempt}"
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                pushed=1
                break
              fi
            else
              git rebase --abort || true
            fi
            sleep 2
          done

          if [ "${pushed}" != "1" ]; then
            echo "[push-initial] failed after retries"
            exit 1
          fi

  pfill_learning:
    name: Train P_fill and E_ret
    needs: decision_initial
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Reset to latest remote main
        run: |
          set -e
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=${GITHUB_WORKSPACE}/src" >> "$GITHUB_ENV"

      - name: Ensure learning dirs
        run: |
          set -e
          mkdir -p data/pred data/pred/archive
          mkdir -p data/market
          mkdir -p outputs/learning
          mkdir -p models

      - name: Resolve current run date
        id: resolve_current_run_date
        env:
          TRADE_DATE_INPUT: ${{ inputs.trade_date }}
        run: |
          set -e
          if [ -n "${TRADE_DATE_INPUT}" ]; then
            CURRENT_RUN_DATE="${TRADE_DATE_INPUT}"
          else
            CURRENT_RUN_DATE="$(python - <<'PY'
          from pathlib import Path
          import re
          raw_root = Path('data/market/raw')
          raw_dates = []
          if raw_root.exists():
              for p in raw_root.rglob('*'):
                  if p.is_dir() and re.fullmatch(r'\d{8}', p.name):
                      raw_dates.append(p.name)
          raw_dates = sorted(set(raw_dates))
          print(raw_dates[-1] if raw_dates else '')
          PY
          )"
          fi

          if echo "${CURRENT_RUN_DATE}" | grep -E '^[0-9]{8}$' >/dev/null; then
            echo "[learning] current_run_date=${CURRENT_RUN_DATE}"
            echo "current_run_date=${CURRENT_RUN_DATE}" >> "$GITHUB_OUTPUT"
            echo "has_current_run_date=true" >> "$GITHUB_OUTPUT"
          else
            echo "[learning] cannot resolve current_run_date; skip learning job"
            echo "current_run_date=" >> "$GITHUB_OUTPUT"
            echo "has_current_run_date=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build candidate trade_date list
        if: steps.resolve_current_run_date.outputs.has_current_run_date == 'true'
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          import csv
          import re

          out_path = Path('data/market/sample_maturity_candidates.csv')
          out_path.parent.mkdir(parents=True, exist_ok=True)
          candidates = set()

          market_dir = Path('data/market')
          for p in market_dir.glob('features_limit_*.csv'):
              m = re.fullmatch(r'features_limit_(\d{8})\.csv', p.name)
              if m:
                  candidates.add(m.group(1))

          pred_archive = Path('data/pred/archive')
          if pred_archive.exists():
              for p in pred_archive.rglob('*.csv'):
                  m = re.search(r'(\d{8})', p.name)
                  if m:
                      candidates.add(m.group(1))

          rows = sorted(candidates)
          with out_path.open('w', encoding='utf-8-sig', newline='') as f:
              writer = csv.DictWriter(f, fieldnames=['trade_date', 'candidate_type'])
              writer.writeheader()
              for td in rows:
                  writer.writerow({'trade_date': td, 'candidate_type': 'PFILL_ERET'})

          print(f'[learning] candidate trade_dates={len(rows)}')
          print(f'[learning] candidate file={out_path}')
          PY
          cat data/market/sample_maturity_candidates.csv || true

      - name: Resolve sample maturity
        if: steps.resolve_current_run_date.outputs.has_current_run_date == 'true'
        run: |
          set -e
          python scripts/resolve_sample_maturity.py \
            --current-run-date "${{ steps.resolve_current_run_date.outputs.current_run_date }}" \
            --raw-root "data/market/raw" \
            --trade-dates-file "data/market/sample_maturity_candidates.csv" \
            --trade-date-column "trade_date" \
            --output-csv "data/market/sample_maturity_latest.csv" \
            --output-json "data/market/sample_maturity_latest.json"
          cat data/market/sample_maturity_latest.csv || true

      - name: Resolve latest PFILL_READY trade_date
        id: resolve_pfill_learning_td
        if: steps.resolve_current_run_date.outputs.has_current_run_date == 'true'
        run: |
          set -e
          TD="$(python - <<'PY'
          from pathlib import Path
          import csv
          path = Path('data/market/sample_maturity_latest.csv')
          dates = []
          if path.exists():
              with path.open('r', encoding='utf-8-sig', newline='') as f:
                  reader = csv.DictReader(f)
                  for row in reader:
                      td = (row.get('trade_date') or '').strip()
                      ready = (row.get('PFILL_READY') or '').strip()
                      if td and ready == '1':
                          dates.append(td)
          dates = sorted(set(dates))
          print(dates[-1] if dates else '')
          PY
          )"
          if echo "${TD}" | grep -E '^[0-9]{8}$' >/dev/null; then
            echo "[learning] P_fill READY trade_date=${TD}"
            echo "trade_date=${TD}" >> "$GITHUB_OUTPUT"
            echo "has_trade_date=true" >> "$GITHUB_OUTPUT"
          else
            echo "[learning] no PFILL_READY trade_date found"
            echo "trade_date=" >> "$GITHUB_OUTPUT"
            echo "has_trade_date=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync pred source for P_fill trade_date
        if: steps.resolve_pfill_learning_td.outputs.has_trade_date == 'true'
        env:
          TRADE_DATE: ${{ steps.resolve_pfill_learning_td.outputs.trade_date }}
          A_TOP10_OWNER: njedu2023-prog
          A_TOP10_REPO: a-top10
          A_TOP10_BRANCH: main
        run: |
          set -e
          FILE_IN_A_TOP10="outputs/decisio/pred_decisio_${TRADE_DATE}.csv"
          RAW_URL="https://raw.githubusercontent.com/${A_TOP10_OWNER}/${A_TOP10_REPO}/${A_TOP10_BRANCH}/${FILE_IN_A_TOP10}"
          TRADE_DATE="${TRADE_DATE}" TOP10_PRED_URL="${RAW_URL}" python scripts/sync_pred_source.py

      - name: Build fill truth
        if: steps.resolve_pfill_learning_td.outputs.has_trade_date == 'true'
        run: |
          set -e
          python scripts/build_fill_truth.py --trade-date "${{ steps.resolve_pfill_learning_td.outputs.trade_date }}"

      - name: Build P_fill trainset
        if: steps.resolve_pfill_learning_td.outputs.has_trade_date == 'true'
        run: |
          set -e
          python scripts/build_pfill_trainset.py --trade-date "${{ steps.resolve_pfill_learning_td.outputs.trade_date }}"

      - name: Train P_fill models
        if: steps.resolve_pfill_learning_td.outputs.has_trade_date == 'true'
        run: |
          set -e
          python scripts/train_pfill.py --trade-date "${{ steps.resolve_pfill_learning_td.outputs.trade_date }}"

      - name: Resolve latest ERET_READY trade_date
        id: resolve_eret_learning_td
        if: steps.resolve_current_run_date.outputs.has_current_run_date == 'true'
        run: |
          set -e
          TD="$(python - <<'PY'
          from pathlib import Path
          import csv
          path = Path('data/market/sample_maturity_latest.csv')
          dates = []
          if path.exists():
              with path.open('r', encoding='utf-8-sig', newline='') as f:
                  reader = csv.DictReader(f)
                  for row in reader:
                      td = (row.get('trade_date') or '').strip()
                      ready = (row.get('ERET_READY') or '').strip()
                      if td and ready == '1':
                          dates.append(td)
          dates = sorted(set(dates))
          print(dates[-1] if dates else '')
          PY
          )"
          if echo "${TD}" | grep -E '^[0-9]{8}$' >/dev/null; then
            echo "[learning] E_ret READY trade_date=${TD}"
            echo "trade_date=${TD}" >> "$GITHUB_OUTPUT"
            echo "has_trade_date=true" >> "$GITHUB_OUTPUT"
          else
            echo "[learning] no ERET_READY trade_date found"
            echo "trade_date=" >> "$GITHUB_OUTPUT"
            echo "has_trade_date=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync pred source for E_ret trade_date
        if: steps.resolve_eret_learning_td.outputs.has_trade_date == 'true'
        env:
          TRADE_DATE: ${{ steps.resolve_eret_learning_td.outputs.trade_date }}
          A_TOP10_OWNER: njedu2023-prog
          A_TOP10_REPO: a-top10
          A_TOP10_BRANCH: main
        run: |
          set -e
          FILE_IN_A_TOP10="outputs/decisio/pred_decisio_${TRADE_DATE}.csv"
          RAW_URL="https://raw.githubusercontent.com/${A_TOP10_OWNER}/${A_TOP10_REPO}/${A_TOP10_BRANCH}/${FILE_IN_A_TOP10}"
          TRADE_DATE="${TRADE_DATE}" TOP10_PRED_URL="${RAW_URL}" python scripts/sync_pred_source.py

      - name: Build fill truth for E_ret trade_date
        if: steps.resolve_eret_learning_td.outputs.has_trade_date == 'true'
        run: |
          set -e
          python scripts/build_fill_truth.py --trade-date "${{ steps.resolve_eret_learning_td.outputs.trade_date }}"

      - name: Build E_ret truth
        if: steps.resolve_eret_learning_td.outputs.has_trade_date == 'true'
        run: |
          set -e
          python scripts/build_eret_truth.py --trade-date "${{ steps.resolve_eret_learning_td.outputs.trade_date }}"

      - name: Build E_ret trainset
        if: steps.resolve_eret_learning_td.outputs.has_trade_date == 'true'
        run: |
          set -e
          python scripts/build_eret_trainset.py --trade-date "${{ steps.resolve_eret_learning_td.outputs.trade_date }}"

      - name: Train E_ret models
        if: steps.resolve_eret_learning_td.outputs.has_trade_date == 'true'
        run: |
          set -e
          python scripts/train_eret.py --trade-date "${{ steps.resolve_eret_learning_td.outputs.trade_date }}"

      - name: Build learning acceptance artifacts
        if: steps.resolve_current_run_date.outputs.has_current_run_date == 'true'
        run: |
          set -e
          mkdir -p outputs/learning
          python - <<'PY'
          from pathlib import Path
          import json
          from datetime import datetime, timezone

          out_dir = Path('outputs/learning')
          models_dir = Path('models')

          def load_json(path: Path):
              if not path.exists():
                  return {}
              try:
                  return json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  return {}

          pfill = load_json(models_dir / 'pfill_meta.json')
          eret = load_json(models_dir / 'eret_meta.json')
          pfill_window = pfill.get('window', {}) or {}
          eret_window = eret.get('window', {}) or {}

          core_fs_v2 = [
              'ret_2d', 'ret_5d', 'ret_10d',
              'volatility_5d', 'volatility_10d', 'volatility_20d',
              'atr', 'downside_vol', 'max_drawdown_20d', 'tail_risk_score',
              'bid_ask_proxy', 'spread_proxy',
          ]
          eret_missing = eret.get('missing_ratio', {}) or {}
          still_all_missing = [c for c in core_fs_v2 if eret_missing.get(c) == 1.0]

          acceptance = {
              'generated_at_utc': datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
              'current_run_date': '${{ steps.resolve_current_run_date.outputs.current_run_date }}',
              'pfill': {
                  'anchor_trade_date': pfill.get('anchor_trade_date', ''),
                  'status': pfill.get('status', ''),
                  'loaded_trade_dates': len(pfill_window.get('loaded_trade_dates', []) or []),
                  'missing_trade_dates': len(pfill_window.get('missing_trade_dates', []) or []),
                  'metrics_valid': pfill.get('metrics_valid', {}) or {},
                  'acceptance_pass': bool(pfill.get('anchor_trade_date')) and pfill.get('status') == 'trained',
              },
              'eret': {
                  'anchor_trade_date': eret.get('anchor_trade_date', ''),
                  'status': eret.get('status', ''),
                  'loaded_trade_dates': len(eret_window.get('loaded_trade_dates', []) or []),
                  'missing_trade_dates': len(eret_window.get('missing_trade_dates', []) or []),
                  'metrics_valid': eret.get('metrics_valid', {}) or {},
                  'fs_v2_still_all_missing': still_all_missing,
                  'acceptance_pass': bool(eret.get('anchor_trade_date')) and eret.get('status') == 'trained' and len(still_all_missing) == 0,
              },
          }
          acceptance['overall_pass'] = bool(acceptance['pfill']['acceptance_pass'] and acceptance['eret']['acceptance_pass'])

          json_path = out_dir / 'learning_acceptance_latest.json'
          md_path = out_dir / 'learning_acceptance_latest.md'
          json_path.write_text(json.dumps(acceptance, ensure_ascii=False, indent=2), encoding='utf-8')

          lines = [
              '# Learning Acceptance Latest',
              '',
              f"- generated_at_utc: {acceptance['generated_at_utc']}",
              f"- current_run_date: {acceptance['current_run_date']}",
              f"- overall_pass: {'PASS' if acceptance['overall_pass'] else 'FAIL'}",
              '',
              '## P_fill',
              f"- anchor_trade_date: {acceptance['pfill']['anchor_trade_date']}",
              f"- status: {acceptance['pfill']['status']}",
              f"- loaded_trade_dates: {acceptance['pfill']['loaded_trade_dates']}",
              f"- missing_trade_dates: {acceptance['pfill']['missing_trade_dates']}",
              f"- acceptance_pass: {'PASS' if acceptance['pfill']['acceptance_pass'] else 'FAIL'}",
              '',
              '## E_ret',
              f"- anchor_trade_date: {acceptance['eret']['anchor_trade_date']}",
              f"- status: {acceptance['eret']['status']}",
              f"- loaded_trade_dates: {acceptance['eret']['loaded_trade_dates']}",
              f"- missing_trade_dates: {acceptance['eret']['missing_trade_dates']}",
              f"- fs_v2_still_all_missing: {acceptance['eret']['fs_v2_still_all_missing']}",
              f"- acceptance_pass: {'PASS' if acceptance['eret']['acceptance_pass'] else 'FAIL'}",
              '',
          ]
          md_path.write_text('\n'.join(lines), encoding='utf-8')
          print(f'[learning-acceptance] overall_pass={acceptance["overall_pass"]}')
          print(f'[learning-acceptance] eret_fs_v2_still_all_missing={still_all_missing}')
          PY

      - name: Commit learning artifacts
        if: steps.resolve_current_run_date.outputs.has_current_run_date == 'true'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          find . -type d -name "__pycache__" -prune -exec rm -rf {} + || true
          find . -type f -name "*.pyc" -delete || true
          mkdir -p .git/info
          grep -qxF "__pycache__/" .git/info/exclude 2>/dev/null || echo "__pycache__/" >> .git/info/exclude
          grep -qxF "*.pyc" .git/info/exclude 2>/dev/null || echo "*.pyc" >> .git/info/exclude

          git add data/pred/pred_source_latest.csv || true
          git add data/pred/archive/*.csv || true
          git add -A data/pred/archive || true
          git add data/market/sample_maturity_candidates.csv || true
          git add data/market/sample_maturity_*.csv || true
          git add data/market/sample_maturity_*.json || true
          git add data/market/fill_truth_*.csv || true
          git add data/market/fill_truth_*.meta.json || true
          git add data/market/pfill_trainset_*.csv || true
          git add data/market/pfill_trainset_*.meta.json || true
          git add data/market/eret_truth_*.csv || true
          git add data/market/eret_truth_*.meta.json || true
          git add data/market/eret_trainset_*.csv || true
          git add data/market/eret_trainset_*.meta.json || true
          git add outputs/learning/learning_acceptance_latest.md || true
          git add outputs/learning/learning_acceptance_latest.json || true
          git add models/pfill_*.joblib || true
          git add models/pfill_*.json || true
          git add models/eret_*.joblib || true
          git add models/eret_*.json || true

          echo "[git-learning] status after add:"
          git status --porcelain | sed -n '1,200p' || true

          if git diff --cached --quiet; then
            echo "[git-learning] no staged changes"
            exit 0
          fi

          git commit -m "auto: resolve sample maturity and update pfill + eret learning artifacts"

          if [ -n "$(git status --porcelain)" ]; then
            git reset --hard HEAD
          fi

          pushed=0
          for attempt in 1 2 3; do
            echo "[push-learning] attempt=${attempt}"
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                pushed=1
                break
              fi
            else
              git rebase --abort || true
            fi
            sleep 2
          done

          if [ "${pushed}" != "1" ]; then
            echo "[push-learning] failed after retries"
            exit 1
          fi

  decision_refresh_after_learning:
    name: Refresh Decision With Latest Learning Models
    needs: pfill_learning
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: ${{ needs.pfill_learning.result == 'success' }}

    steps:
      - name: Checkout latest main after learning
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Reset to latest remote main
        run: |
          set -e
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=${GITHUB_WORKSPACE}/src" >> "$GITHUB_ENV"

      - name: Ensure output dirs
        run: |
          set -e
          mkdir -p data/decision docs/signals docs/reports docs/weights outputs/decision

      - name: Run decision pipeline after learning
        env:
          TRADE_DATE: ${{ inputs.trade_date }}
        run: |
          set -e
          echo "[refresh] using latest committed models after learning"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${TRADE_DATE}" ]; then
            echo "[run_v2-refresh] manual trade_date=${TRADE_DATE}"
            python scripts/run_v2.py --trade-date "${TRADE_DATE}"
          else
            echo "[run_v2-refresh] auto mode"
            python scripts/run_v2.py
          fi

      - name: Validate IO contract after refresh
        run: |
          set -e
          python scripts/validate_io_contract.py

      - name: Show refresh status
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          import json

          meta_path = Path('models/eret_meta.json')
          if meta_path.exists():
              meta = json.loads(meta_path.read_text(encoding='utf-8'))
              print('[refresh] eret_anchor=', meta.get('anchor_trade_date'))
              print('[refresh] eret_status=', meta.get('status'))
              mr = meta.get('missing_ratio', {}) or {}
              core = ['ret_2d','ret_5d','ret_10d','volatility_5d','volatility_10d','volatility_20d','atr','downside_vol','max_drawdown_20d','tail_risk_score','bid_ask_proxy','spread_proxy']
              print('[refresh] eret_fs_v2_missing_ratio=', {c: mr.get(c) for c in core})

          for p in sorted(Path('outputs/decision').glob('decision_report_*.md'))[-5:]:
              print('[refresh] report=', p.as_posix())
          PY

      - name: Commit refreshed decision outputs
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          find . -type d -name "__pycache__" -prune -exec rm -rf {} + || true
          find . -type f -name "*.pyc" -delete || true
          mkdir -p .git/info
          grep -qxF "__pycache__/" .git/info/exclude 2>/dev/null || echo "__pycache__/" >> .git/info/exclude
          grep -qxF "*.pyc" .git/info/exclude 2>/dev/null || echo "*.pyc" >> .git/info/exclude

          git add outputs/decision/* || true
          git add outputs/decision/**/*.md || true
          git add outputs/decision/**/*.json || true
          git add data/decision/decision_candidates_*.csv || true
          git add data/decision/decision_execution_*.csv || true
          git add data/decision/decision_learning.csv || true
          git add docs/weights/weights_latest.csv || true
          git add docs/weights/weights_*.csv || true
          git add docs/signals/top10_latest.csv || true
          git add docs/signals/top10_*.csv || true
          git add docs/signals/TopEVR_latest.csv || true
          git add docs/signals/TopEVR_*.csv || true
          git add docs/reports/*.md || true
          git add -A docs/reports || true

          echo "[git-refresh] status after add:"
          git status --porcelain | sed -n '1,200p' || true

          if git diff --cached --quiet; then
            echo "[git-refresh] no staged changes"
            exit 0
          fi

          git commit -m "auto: refresh decision outputs after learning models"

          if [ -n "$(git status --porcelain)" ]; then
            git reset --hard HEAD
          fi

          pushed=0
          for attempt in 1 2 3; do
            echo "[push-refresh] attempt=${attempt}"
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                pushed=1
                break
              fi
            else
              git rebase --abort || true
            fi
            sleep 2
          done

          if [ "${pushed}" != "1" ]; then
            echo "[push-refresh] failed after retries"
            exit 1
          fi
