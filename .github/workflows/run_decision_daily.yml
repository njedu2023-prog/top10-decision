name: Run Top10 Decision (Auto Daily)

on:
  schedule:
    # Mon-Fri 21:15 Beijing (UTC+8) == 13:15 UTC
    - cron: "15 13 * * 1-5"
  workflow_dispatch:
    inputs:
      trade_date:
        description: "手动指定交易日 YYYYMMDD（Decision: 留空=使用 a-top10 decisio latest；Learning: 留空=自动选择已成熟 trade_date）"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: top10-decision-daily
  cancel-in-progress: false

jobs:
  decision:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=${GITHUB_WORKSPACE}/src" >> $GITHUB_ENV

      - name: Ensure output dirs
        run: |
          set -e
          mkdir -p data/pred
          mkdir -p data/pred/archive
          mkdir -p data/market
          mkdir -p data/market/raw
          mkdir -p data/decision
          mkdir -p docs/signals
          mkdir -p docs/reports
          mkdir -p docs/weights
          mkdir -p outputs/decision
          mkdir -p outputs/learning
          mkdir -p models

      # 1) 同步 prior：pred_source_latest + pred archive
      - name: Sync pred source snapshot (to data/pred/pred_source_latest.csv)
        env:
          TRADE_DATE: ${{ inputs.trade_date }}
          A_TOP10_OWNER: njedu2023-prog
          A_TOP10_REPO: a-top10
          A_TOP10_BRANCH: main
        run: |
          set -e

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${TRADE_DATE}" ]; then
            echo "[sync-pred] manual trade_date=${TRADE_DATE}"

            if ! echo "${TRADE_DATE}" | grep -E '^[0-9]{8}$' >/dev/null; then
              echo "[sync-pred] invalid trade_date: ${TRADE_DATE} (expect YYYYMMDD)"
              exit 1
            fi

            FILE_IN_A_TOP10="outputs/decisio/pred_decisio_${TRADE_DATE}.csv"
            RAW_URL="https://raw.githubusercontent.com/${A_TOP10_OWNER}/${A_TOP10_REPO}/${A_TOP10_BRANCH}/${FILE_IN_A_TOP10}"
            echo "[sync-pred] TOP10_PRED_URL=${RAW_URL}"

            TRADE_DATE="${TRADE_DATE}" TOP10_PRED_URL="${RAW_URL}" python scripts/sync_pred_source.py
          else
            RAW_URL="https://raw.githubusercontent.com/njedu2023-prog/a-top10/main/outputs/decisio/pred_decisio_latest.csv"
            echo "[sync-pred] TOP10_PRED_URL=${RAW_URL}"

            TOP10_PRED_URL="${RAW_URL}" python scripts/sync_pred_source.py
          fi

          echo "[sync-pred] snapshot saved -> data/pred/pred_source_latest.csv"
          head -n 3 data/pred/pred_source_latest.csv || true
          wc -l data/pred/pred_source_latest.csv || true

          echo "[sync-pred] archive tree:"
          find data/pred -maxdepth 3 -type f | sort || true

      # 2) 同步 market raw 多源原料
      - name: Sync market raw snapshots
        env:
          TRADE_DATE: ${{ inputs.trade_date }}
          MARKET_RAW_OWNER: njedu2023-prog
          MARKET_RAW_REPO: a-share-top3-data
          MARKET_RAW_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${TRADE_DATE}" ]; then
            echo "[sync-market-raw] manual trade_date=${TRADE_DATE}"
            python scripts/sync_market_raw.py --trade-date "${TRADE_DATE}"
          else
            echo "[sync-market-raw] auto mode"
            python scripts/sync_market_raw.py
          fi

          echo "[sync-market-raw] tree:"
          find data/market/raw -maxdepth 3 -type d | sort || true

          echo "[sync-market-raw] files:"
          find data/market/raw -maxdepth 3 -type f | sort || true

      # 3) 从 raw 层构建 FS 四件套
      - name: Build market FS
        env:
          TRADE_DATE: ${{ inputs.trade_date }}
        run: |
          set -e

          echo "[fs] precheck raw tree:"
          find data/market/raw -maxdepth 3 -type f | sort || true

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${TRADE_DATE}" ]; then
            echo "[fs] build with manual trade_date=${TRADE_DATE}"
            python scripts/build_market_fs.py --trade-date "${TRADE_DATE}"
          else
            echo "[fs] build with latest raw snapshot"
            python scripts/build_market_fs.py
          fi

          echo "[fs] generated files:"
          ls -lah data/market || true

      # 4) 运行 Decision
      - name: Run decision pipeline (V2 orchestrator)
        run: |
          set -e
          python scripts/run_v2.py

      # 5) IO 契约验证
      - name: Validate IO contract (must pass)
        run: |
          set -e
          python scripts/validate_io_contract.py

      - name: Commit & push outputs (safe)
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git pull --rebase origin main || true

          find . -type d -name "__pycache__" -prune -exec rm -rf {} + || true
          find . -type f -name "*.pyc" -delete || true

          echo "__pycache__/" >> .git/info/exclude
          echo "*.pyc" >> .git/info/exclude

          # prior 输入
          git add data/pred/pred_source_latest.csv || true
          git add data/pred/archive/*.csv || true
          git add -A data/pred/archive || true

          # 旧路径兼容
          git add data/pred/pred_top10_latest.csv || true
          git add data/pred/pred_top10_*.csv || true

          # market raw 层（递归提交整棵目录树）
          git add -A data/market/raw || true

          # market FS 四件套
          git add data/market/features_base_*.csv || true
          git add data/market/features_limit_*.csv || true
          git add data/market/truth_close_*.csv || true
          git add data/market/_meta_*.json || true

          # decision 输出
          git add docs/weights/weights_latest.csv || true
          git add docs/weights/weights_*.csv || true

          git add outputs/decision/* || true
          git add outputs/decision/**/*.md || true
          git add outputs/decision/**/*.json || true

          # learning / candidates
          git add data/decision/decision_candidates_*.csv || true
          git add data/decision/decision_execution_*.csv || true
          git add data/decision/decision_learning.csv || true

          # signals
          git add docs/signals/top10_latest.csv || true
          git add docs/signals/top10_*.csv || true

          # reports
          git add docs/reports/*.md || true
          git add -A docs/reports || true

          echo "[git] status after add:"
          git status --porcelain || true

          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "auto: sync market raw, build fs, update decision outputs"
            git push
            echo "[push] done"
          else
            echo "[push] no changes"
          fi

  pfill_learning:
    needs: decision
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reset to latest remote main
        run: |
          set -e
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=${GITHUB_WORKSPACE}/src" >> $GITHUB_ENV

      - name: Ensure learning dirs
        run: |
          set -e
          mkdir -p data/pred
          mkdir -p data/pred/archive
          mkdir -p data/market
          mkdir -p outputs/learning
          mkdir -p models

      - name: Resolve current run date
        id: resolve_current_run_date
        env:
          TRADE_DATE_INPUT: ${{ inputs.trade_date }}
        run: |
          set -e

          if [ -n "${TRADE_DATE_INPUT}" ]; then
            CURRENT_RUN_DATE="${TRADE_DATE_INPUT}"
          else
            CURRENT_RUN_DATE="$(python - <<'PY'
          from pathlib import Path
          import re

          raw_root = Path("data/market/raw")
          raw_dates = []

          if raw_root.exists():
              for p in raw_root.rglob("*"):
                  if p.is_dir() and re.fullmatch(r"\d{8}", p.name):
                      raw_dates.append(p.name)

          raw_dates = sorted(set(raw_dates))
          print(raw_dates[-1] if raw_dates else "")
          PY
          )"
          fi

          if echo "${CURRENT_RUN_DATE}" | grep -E '^[0-9]{8}$' >/dev/null; then
            echo "[learning] current_run_date=${CURRENT_RUN_DATE}"
            echo "current_run_date=${CURRENT_RUN_DATE}" >> "$GITHUB_OUTPUT"
            echo "has_current_run_date=true" >> "$GITHUB_OUTPUT"
          else
            echo "[learning] cannot resolve current_run_date; skip learning job"
            echo "current_run_date=" >> "$GITHUB_OUTPUT"
            echo "has_current_run_date=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build candidate trade_date list for maturity resolver
        if: steps.resolve_current_run_date.outputs.has_current_run_date == 'true'
        run: |
          set -e

          python - <<'PY'
          from pathlib import Path
          import csv
          import re

          out_path = Path("data/market/sample_maturity_candidates.csv")
          out_path.parent.mkdir(parents=True, exist_ok=True)

          candidates = set()

          market_dir = Path("data/market")
          for p in market_dir.glob("features_limit_*.csv"):
              m = re.fullmatch(r"features_limit_(\d{8})\.csv", p.name)
              if m:
                  candidates.add(m.group(1))

          pred_archive = Path("data/pred/archive")
          if pred_archive.exists():
              for p in pred_archive.rglob("*.csv"):
                  m = re.search(r"(\d{8})", p.name)
                  if m:
                      candidates.add(m.group(1))

          rows = sorted(candidates)

          with out_path.open("w", encoding="utf-8-sig", newline="") as f:
              writer = csv.DictWriter(
                  f,
                  fieldnames=["trade_date", "candidate_type"],
              )
              writer.writeheader()
              for td in rows:
                  writer.writerow(
                      {
                          "trade_date": td,
                          "candidate_type": "PFILL_ERET",
                      }
                  )

          print(f"[learning] candidate trade_dates={len(rows)}")
          print(f"[learning] candidate file={out_path}")
          PY

          cat data/market/sample_maturity_candidates.csv || true

      - name: Resolve sample maturity
        if: steps.resolve_current_run_date.outputs.has_current_run_date == 'true'
        run: |
          set -e

          python scripts/resolve_sample_maturity.py \
            --current-run-date "${{ steps.resolve_current_run_date.outputs.current_run_date }}" \
            --raw-root "data/market/raw" \
            --trade-dates-file "data/market/sample_maturity_candidates.csv" \
            --trade-date-column "trade_date" \
            --output-csv "data/market/sample_maturity_latest.csv" \
            --output-json "data/market/sample_maturity_latest.json"

          echo "[learning] resolved sample maturity:"
          cat data/market/sample_maturity_latest.csv || true

      - name: Resolve matured trade_date for P_fill learning
        id: resolve_pfill_learning_td
        if: steps.resolve_current_run_date.outputs.has_current_run_date == 'true'
        run: |
          set -e

          TD="$(python - <<'PY'
          from pathlib import Path
          import csv

          path = Path("data/market/sample_maturity_latest.csv")
          if not path.exists():
              print("")
              raise SystemExit(0)

          rows = []
          with path.open("r", encoding="utf-8-sig", newline="") as f:
              reader = csv.DictReader(f)
              for row in reader:
                  td = (row.get("trade_date") or "").strip()
                  pfill_ready = (row.get("PFILL_READY") or "").strip()
                  if td and pfill_ready == "1":
                      rows.append(td)

          rows = sorted(set(rows))
          print(rows[-1] if rows else "")
          PY
          )"

          if echo "${TD}" | grep -E '^[0-9]{8}$' >/dev/null; then
            echo "[learning] resolved matured P_fill trade_date=${TD}"
            echo "trade_date=${TD}" >> "$GITHUB_OUTPUT"
            echo "has_trade_date=true" >> "$GITHUB_OUTPUT"
          else
            echo "[learning] no PFILL_READY trade_date found; skip P_fill learning"
            echo "trade_date=" >> "$GITHUB_OUTPUT"
            echo "has_trade_date=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build fill truth
        if: steps.resolve_pfill_learning_td.outputs.has_trade_date == 'true'
        run: |
          set -e
          python scripts/build_fill_truth.py --trade-date "${{ steps.resolve_pfill_learning_td.outputs.trade_date }}"

      - name: Build P_fill trainset
        if: steps.resolve_pfill_learning_td.outputs.has_trade_date == 'true'
        run: |
          set -e
          python scripts/build_pfill_trainset.py --trade-date "${{ steps.resolve_pfill_learning_td.outputs.trade_date }}"

      - name: Train P_fill models
        if: steps.resolve_pfill_learning_td.outputs.has_trade_date == 'true'
        run: |
          set -e
          python scripts/train_pfill.py --trade-date "${{ steps.resolve_pfill_learning_td.outputs.trade_date }}"

      - name: Resolve matured trade_date for E_ret learning
        id: resolve_eret_learning_td
        if: steps.resolve_current_run_date.outputs.has_current_run_date == 'true'
        run: |
          set -e

          TD="$(python - <<'PY'
          from pathlib import Path
          import csv

          path = Path("data/market/sample_maturity_latest.csv")
          if not path.exists():
              print("")
              raise SystemExit(0)

          rows = []
          with path.open("r", encoding="utf-8-sig", newline="") as f:
              reader = csv.DictReader(f)
              for row in reader:
                  td = (row.get("trade_date") or "").strip()
                  eret_ready = (row.get("ERET_READY") or "").strip()
                  if td and eret_ready == "1":
                      rows.append(td)

          rows = sorted(set(rows))
          print(rows[-1] if rows else "")
          PY
          )"

          if echo "${TD}" | grep -E '^[0-9]{8}$' >/dev/null; then
            echo "[learning] resolved matured E_ret trade_date=${TD}"
            echo "trade_date=${TD}" >> "$GITHUB_OUTPUT"
            echo "has_trade_date=true" >> "$GITHUB_OUTPUT"
          else
            echo "[learning] no ERET_READY trade_date found; skip E_ret learning"
            echo "trade_date=" >> "$GITHUB_OUTPUT"
            echo "has_trade_date=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build E_ret truth
        if: steps.resolve_eret_learning_td.outputs.has_trade_date == 'true'
        run: |
          set -e
          python scripts/build_eret_truth.py --trade-date "${{ steps.resolve_eret_learning_td.outputs.trade_date }}"

      - name: Build E_ret trainset
        if: steps.resolve_eret_learning_td.outputs.has_trade_date == 'true'
        run: |
          set -e
          python scripts/build_eret_trainset.py --trade-date "${{ steps.resolve_eret_learning_td.outputs.trade_date }}"

      - name: Train E_ret models
        if: steps.resolve_eret_learning_td.outputs.has_trade_date == 'true'
        run: |
          set -e
          python scripts/train_eret.py --trade-date "${{ steps.resolve_eret_learning_td.outputs.trade_date }}"

      - name: Show learning artifacts
        if: steps.resolve_current_run_date.outputs.has_current_run_date == 'true'
        run: |
          set -e
          echo "[learning] pfill_trade_date=${{ steps.resolve_pfill_learning_td.outputs.trade_date }}"
          echo "[learning] eret_trade_date=${{ steps.resolve_eret_learning_td.outputs.trade_date }}"
          ls -lah data/market || true
          ls -lah models || true

      - name: Commit learning artifacts
        if: steps.resolve_current_run_date.outputs.has_current_run_date == 'true'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git pull --rebase origin main || true

          git add data/market/sample_maturity_candidates.csv || true
          git add data/market/sample_maturity_*.csv || true
          git add data/market/sample_maturity_*.json || true

          git add data/market/fill_truth_*.csv || true
          git add data/market/fill_truth_*.meta.json || true
          git add data/market/pfill_trainset_*.csv || true
          git add data/market/pfill_trainset_*.meta.json || true

          git add data/market/eret_truth_*.csv || true
          git add data/market/eret_truth_*.meta.json || true
          git add data/market/eret_trainset_*.csv || true
          git add data/market/eret_trainset_*.meta.json || true

          git add models/pfill_*.joblib || true
          git add models/pfill_*.json || true
          git add models/eret_*.joblib || true
          git add models/eret_*.json || true

          echo "[git-learning] status after add:"
          git status --porcelain || true

          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "auto: resolve sample maturity and update pfill + eret learning artifacts"
            git push
            echo "[push-learning] done"
          else
            echo "[push-learning] no changes"
          fi
