name: Run Premium (Follow Decision)

on:
  workflow_run:
    workflows: ["Run Top10 Decision (Auto Daily)"]
    types: [completed]

  workflow_dispatch:
    inputs:
      cmd:
        description: "执行命令：predict / train / all"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - predict
          - train

permissions:
  contents: write

concurrency:
  group: premium-follow-decision
  cancel-in-progress: false

jobs:
  premium:
    # 自动触发：仅当上游成功才跑；手动触发：直接跑
    # 另外：只跑 main 分支（避免未来 PR/分支触发混乱）
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
        && github.ref == 'refs/heads/main'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Premium
        env:
          PYTHONPATH: "${{ github.workspace }}/src"
        run: |
          CMD="${{ inputs.cmd }}"
          if [ -z "$CMD" ]; then CMD="all"; fi
          echo "[run_premium] cmd=$CMD"
          python scripts/run_premium.py "$CMD" --verbose

      - name: Sanity check outputs
        run: |
          test -f outputs/premium/_last_run.txt
          echo "=== outputs/premium ==="
          ls -la outputs/premium || true
          echo "=== docs/reports ==="
          ls -la docs/reports || true
          echo "=== data/market ==="
          ls -la data/market || true

      - name: Commit outputs + market cache (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # ✅ Premium V2：必须提交真值缓存（data/market）与报告（docs/reports）
          git add outputs/premium || true
          git add docs/reports || true
          git add data/market || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          # 避免并发/手动提交导致 push 冲突
          git pull --rebase

          # 从 _last_run.txt 里读取 trade_date（若读取不到就用 unknown）
          TRADE_DATE="$(grep -E '^trade_date:' -m 1 outputs/premium/_last_run.txt | awk '{print $2}' || true)"
          if [ -z "$TRADE_DATE" ]; then TRADE_DATE="unknown"; fi

          git commit -m "premium: update outputs + market cache (${TRADE_DATE})"
          git push
