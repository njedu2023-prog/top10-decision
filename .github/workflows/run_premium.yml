name: Run Premium (Follow Decision)

on:
  workflow_run:
    workflows: ["Run Top10 Decision (Auto Daily)"]
    types: [completed]

  workflow_dispatch:
    inputs:
      cmd:
        description: "执行命令：predict / train / all"
        required: false
        default: "all"
        type: choice
        options:
          - predict
          - all
          - train

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: premium-follow-decision
  cancel-in-progress: false

jobs:
  premium:
    # 自动触发：仅当上游成功才跑；手动触发：直接跑
    # 另外：只跑 main 分支（避免未来 PR/分支触发混乱）
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
        && github.ref == 'refs/heads/main'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      # ✅ 先同步远端（工作区干净），避免后续操作被分叉历史影响
      - name: Sync with remote (rebase)
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main || (git rebase --abort && git reset --hard origin/main)

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Premium
        env:
          PYTHONPATH: "${{ github.workspace }}/src"
          TUSHARE_TOKEN: "${{ secrets.TUSHARE_TOKEN }}"
        run: |
          set -e

          EVENT_NAME="${{ github.event_name }}"

          # 自动链路跟随 Decision 成功后，必须先 train 再 predict，
          # 让 EHX 学习版模型有机会落盘并被 predict 接管。
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            CMD="all"
          else
            CMD="${{ github.event.inputs.cmd }}"
            if [ -z "$CMD" ]; then CMD="all"; fi
          fi

          echo "[run_premium] event=$EVENT_NAME cmd=$CMD"
          python scripts/run_premium.py "$CMD" --verbose

      - name: Sanity check outputs
        run: |
          set -e
          test -f outputs/premium/_last_run.txt

          echo "=== outputs/premium ==="
          ls -la outputs/premium || true

          echo "=== outputs/premium/models ==="
          ls -la outputs/premium/models || true

          echo "=== docs/reports ==="
          ls -la docs/reports || true

          echo "=== data/market ==="
          ls -la data/market || true

          echo "=== _last_run.txt ==="
          cat outputs/premium/_last_run.txt || true

      - name: Commit outputs + market cache (if changed)
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # ✅ Premium V3：提交预测产物、EHX 模型产物、报告与真值缓存
          git add outputs/premium || true
          git add docs/reports || true
          git add data/market || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          # 从 _last_run.txt 里读取 trade_date（若读取不到就用 unknown）
          TRADE_DATE="$(grep -E '^trade_date:' -m 1 outputs/premium/_last_run.txt | awk '{print $2}' || true)"
          if [ -z "$TRADE_DATE" ]; then TRADE_DATE="unknown"; fi

          git commit -m "premium: update outputs + market cache (${TRADE_DATE})"

          # ✅ 不在 commit 后再 pull --rebase，避免脏工作区冲突
          # ✅ push 遇到临时远端故障时，不让产物生成流程失败
          set +e
          git push origin HEAD:main
          RC=$?
          set -e

          if [ $RC -ne 0 ]; then
            echo "WARNING: git push failed (likely transient remote issue)."
            echo "The workflow will exit 0 to keep outputs generation green."
            exit 0
          fi
