name: Run Premium (Follow Decision)

on:
  workflow_run:
    workflows: ["Run Top10 Decision (Auto Daily)"]
    types: [completed]

  workflow_dispatch:
    inputs:
      cmd:
        description: "执行命令：predict / train / all（默认 predict，保证主线不断更）"
        required: false
        default: "predict"
        type: choice
        options:
          - predict
          - train
          - all

permissions:
  contents: write

concurrency:
  group: premium-follow-decision
  cancel-in-progress: false

jobs:
  premium:
    # 自动触发：仅当上游成功才跑；手动触发：直接跑
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Premium
        env:
          PYTHONPATH: "${{ github.workspace }}/src"
        run: |
          CMD="${{ inputs.cmd }}"
          if [ -z "$CMD" ]; then CMD="predict"; fi
          echo "[run_premium] cmd=$CMD"
          python scripts/run_premium.py "$CMD" --verbose

      - name: Sanity check outputs
        run: |
          test -f outputs/premium/_last_run.txt
          test -d outputs/premium
          ls -la outputs/premium || true

          # 新主线：报告落在 docs/reports
          test -d docs/reports
          ls -la docs/reports || true
          test -f docs/reports/premium_latest.md || true

      - name: Commit outputs (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # ✅ 提交 Premium 产物 + 报告（不提交 data/market 缓存，避免仓库膨胀）
          git add outputs/premium docs/reports || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "premium: update reports/outputs"
          git push
