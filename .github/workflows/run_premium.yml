name: Run Premium (Follow Decision)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/run_premium.yml"
      - "scripts/run_premium.py"
      - "scripts/backfill_premium_limitup_truth.py"
      - "scripts/backfill_premium_top1_shadow.py"
      - "scripts/backfill_premium_execution_truth.py"
      - "scripts/maybe_train_premium.py"
      - "scripts/rebuild_premium_reports.py"
      - "scripts/build_premium_final.py"
      - "scripts/localize_premium_reports.py"
      - "scripts/apple_style_premium_reports.py"
      - "scripts/clarify_premium_report_metrics.py"
      - "scripts/sync_pred_source.py"
      - "src/top10decision/premium/**"
      - "tests/test_premium_*.py"

  schedule:
    # Mon-Fri 21:15 Beijing (UTC+8) == 13:15 UTC, same as decision mainline.
    - cron: "15 13 * * 1-5"

  workflow_run:
    workflows: ["Run Top10 Decision (Auto Daily)"]
    types: [completed]

  workflow_dispatch:
    inputs:
      cmd:
        description: "执行命令：predict / train / all"
        required: false
        default: "predict"
        type: choice
        options:
          - predict
          - all
          - train

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONDONTWRITEBYTECODE: "1"

# Premium、Decision 与 V12 都会写入 main/data/market；必须跨 workflow 串行化。
concurrency:
  group: decision-auction-main-writer
  cancel-in-progress: false

jobs:
  premium:
    # 自动触发：仅当上游成功才跑；手动触发：直接跑。
    # 只跑 main 分支，避免 PR/分支触发混乱。
    if: >-
      ${{
        (
          github.event_name == 'workflow_dispatch'
          || github.event_name == 'push'
          || github.event_name == 'schedule'
          || github.event.workflow_run.conclusion == 'success'
        )
        && github.ref == 'refs/heads/main'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Sync with remote
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Premium safety tests
        env:
          PYTHONPATH: "${{ github.workspace }}/src"
        run: |
          set -e
          python -m unittest discover -s tests -p 'test_premium_*.py' -v

      - name: Sync latest Premium candidate pool
        env:
          A_TOP10_PRED_URL: "https://raw.githubusercontent.com/njedu2023-prog/a-top10/main/outputs/decisio/pred_decisio_latest.csv"
        run: |
          set -e
          mkdir -p data/pred data/pred/archive
          TOP10_PRED_URL="${A_TOP10_PRED_URL}" python scripts/sync_pred_source.py

          echo "=== synced data/pred/pred_source_latest.csv head ==="
          python - <<'PY'
          import pandas as pd
          p = "data/pred/pred_source_latest.csv"
          df = pd.read_csv(p)
          print(df.head(3).to_string(index=False))
          if "trade_date" in df.columns:
              print("premium_candidate_trade_date=", sorted(df["trade_date"].astype(str).unique())[-1])
          PY

      - name: Resolve Premium command
        run: |
          set -e
          EVENT_NAME="${{ github.event_name }}"

          # 日常发布优先走 predict：使用已训练模型快速预测、回填真值、刷新报告。
          # 需要刷新模型时，手动运行 workflow 并选择 all 或 train。
          if [ "$EVENT_NAME" = "workflow_run" ] || [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "push" ]; then
            CMD="predict"
          else
            CMD="${{ github.event.inputs.cmd }}"
            if [ -z "$CMD" ]; then CMD="predict"; fi
          fi

          echo "PREMIUM_CMD=$CMD" >> "$GITHUB_ENV"
          echo "[run_premium] event=$EVENT_NAME cmd=$CMD"

      - name: Backfill matured Premium T and T+1 truth
        env:
          TUSHARE_TOKEN: "${{ secrets.TUSHARE_TOKEN }}"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -e
          python scripts/backfill_premium_limitup_truth.py --verbose

      - name: Incremental Premium training
        if: env.PREMIUM_CMD == 'predict'
        env:
          PYTHONPATH: "${{ github.workspace }}/src"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -e
          python scripts/maybe_train_premium.py --min-new-days 5 --verbose

      - name: Run Premium
        env:
          PYTHONPATH: "${{ github.workspace }}/src"
          TUSHARE_TOKEN: "${{ secrets.TUSHARE_TOKEN }}"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -e
          python scripts/run_premium.py "$PREMIUM_CMD" --verbose

      - name: Rebuild TOP1 shadow ledger
        env:
          PYTHONPATH: "${{ github.workspace }}/src"
          TUSHARE_TOKEN: "${{ secrets.TUSHARE_TOKEN }}"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -e
          python scripts/backfill_premium_top1_shadow.py --start-date 20260701 --verbose

      - name: Backfill TOP10 executable market truth
        env:
          PYTHONPATH: "${{ github.workspace }}/src"
          TUSHARE_TOKEN: "${{ secrets.TUSHARE_TOKEN }}"
          PYTHONDONTWRITEBYTECODE: "1"
          PREMIUM_EXECUTION_TRUTH_FETCH_BUDGET: "120"
        run: |
          set -e
          python scripts/backfill_premium_execution_truth.py \
            --start-date 20260610 \
            --fetch-budget "$PREMIUM_EXECUTION_TRUTH_FETCH_BUDGET" \
            --verbose

      - name: Rebuild Premium HTML report archive
        env:
          PYTHONPATH: "${{ github.workspace }}/src"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -e
          python scripts/rebuild_premium_reports.py --verbose

      - name: Build Premium final executable report
        env:
          PYTHONPATH: "${{ github.workspace }}/src"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -e
          python scripts/build_premium_final.py --verbose

      - name: Localize and style Premium HTML reports
        env:
          PYTHONPATH: "${{ github.workspace }}/src"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -e
          python scripts/localize_premium_reports.py --verbose
          python scripts/apple_style_premium_reports.py --verbose
          python scripts/clarify_premium_report_metrics.py --verbose
          python scripts/build_premium_final.py --link-only --verbose

      - name: Sanity check outputs
        env:
          PYTHONPATH: "${{ github.workspace }}/src"
        run: |
          set -e
          test -f outputs/premium/_last_run.txt

          echo "=== outputs/premium ==="
          ls -la outputs/premium || true

          echo "=== outputs/premium/models ==="
          ls -la outputs/premium/models || true

          echo "=== docs/reports ==="
          ls -la docs/reports || true

          echo "=== data/market ==="
          ls -la data/market || true

          echo "=== _last_run.txt ==="
          cat outputs/premium/_last_run.txt || true

          echo "=== Premium final execution artifacts ==="
          test -f outputs/premium/premium_final_buy_latest.csv
          test -f outputs/premium/premium_final_watch_latest.csv
          test -f outputs/premium/premium_final_reject_latest.csv
          test -f outputs/premium/models/execution_profit_model_meta.json
          test -f outputs/premium/models/execution_profit_backtest_meta.json
          test -f outputs/premium/models/execution_actual_top1_backtest_meta.json
          test -f outputs/premium/verification/premium_top1_shadow_ledger.csv
          test -f outputs/premium/verification/premium_top1_shadow_summary.json
          test -f outputs/premium/verification/premium_top1_shadow_202607.csv
          test -f outputs/premium/verification/premium_execution_truth_ledger.csv
          test -f outputs/premium/verification/premium_execution_truth_summary.json
          test -f docs/reports/premium_final_latest.html
          test -f docs/reports/premium_latest.html
          python -m json.tool outputs/premium/models/execution_profit_model_meta.json >/dev/null
          python -m json.tool outputs/premium/models/execution_profit_backtest_meta.json >/dev/null
          python -m json.tool outputs/premium/models/execution_actual_top1_backtest_meta.json >/dev/null
          python -m json.tool outputs/premium/verification/premium_top1_shadow_summary.json >/dev/null
          python -m json.tool outputs/premium/verification/premium_execution_truth_summary.json >/dev/null
          ! grep -q '净收益执行名单' docs/reports/premium_latest.html
          ! grep -q 'TOP20 观察名单' docs/reports/premium_latest.html
          grep -q '<th>排名</th>' docs/reports/premium_latest.html
          grep -q '<th>T日攻击力</th>' docs/reports/premium_latest.html
          grep -q '<th>T+1承接力</th>' docs/reports/premium_latest.html
          grep -q '<th>接力综合分</th>' docs/reports/premium_latest.html
          ! grep -q '<th>Rank</th>' docs/reports/premium_latest.html
          ! grep -q '表格可横向滚动' docs/reports/premium_latest.html
          grep -q 'T收盘' docs/reports/premium_latest.html
          grep -q 'TOP1 影子验证' docs/reports/premium_latest.html
          grep -q 'TOP1 总收益' docs/reports/premium_latest.html
          grep -Fq '<details class="shadow-details" aria-label="TOP1 影子验证">' docs/reports/premium_latest.html
          ! grep -Fq '<details class="shadow-details" open' docs/reports/premium_latest.html
          grep -Fq '.shadow-details[open] .metrics-toggle::before{content:"−"' docs/reports/premium_latest.html
          grep -q 'premium-report-nav-scroll-state-v1' docs/reports/premium_latest.html
          grep -q '<h1>Premium TOP 10</h1>' docs/reports/premium_latest.html
          grep -q 'TOP10: T日涨停概率最高 · D ' docs/reports/premium_latest.html
          python - <<'PY'
          import csv
          import json
          import pandas as pd
          from pathlib import Path
          from top10decision.premium.limitup_probability_engine import (
              BUNDLE_ARTIFACT_VERSION,
              GATE_VERSION,
          )
          from top10decision.premium.execution_profit_model import (
              EMBARGO_DAYS as EXECUTION_EMBARGO_DAYS,
              MODEL_VERSION as EXECUTION_MODEL_VERSION,
              TRUTH_SCHEMA_VERSION as EXECUTION_TRUTH_SCHEMA_VERSION,
              VALIDATION_MODE as EXECUTION_VALIDATION_MODE,
          )

          execution_meta = json.loads(
              Path("outputs/premium/models/execution_profit_model_meta.json").read_text(encoding="utf-8")
          )
          execution_reason = str(execution_meta.get("reason", ""))
          if execution_reason.startswith("execution_model_error:"):
              raise SystemExit(f"Premium execution model crashed: {execution_reason}")
          if execution_meta.get("model_version") != EXECUTION_MODEL_VERSION:
              raise SystemExit("Premium execution-profit model version mismatch")
          if execution_meta.get("validation_mode") != EXECUTION_VALIDATION_MODE:
              raise SystemExit("Premium execution-profit validation contract missing")
          if execution_meta.get("truth_source") != "premium_execution_truth_ledger.csv":
              raise SystemExit("Premium execution-profit model is not bound to actual truth")
          if int(execution_meta.get("embargo_days", 0) or 0) != EXECUTION_EMBARGO_DAYS:
              raise SystemExit("Premium execution-profit embargo mismatch")
          if int(execution_meta.get("history_days", 0) or 0) >= 30 and int(execution_meta.get("return_rows", 0) or 0) >= 150:
              if len(str(execution_meta.get("data_fingerprint", ""))) != 64:
                  raise SystemExit("Premium execution-profit data fingerprint missing")
              if len(str(execution_meta.get("feature_fingerprint", ""))) != 64:
                  raise SystemExit("Premium execution-profit feature fingerprint missing")
          if not bool(execution_meta.get("ready", False)):
              final_buy = pd.read_csv("outputs/premium/premium_final_buy_latest.csv")
              if not final_buy.empty:
                  raise SystemExit("Premium execution model is guarded but buy list is non-empty")

          limitup_meta = json.loads(
              Path("outputs/premium/models/limitup_probability_engine_meta.json").read_text(encoding="utf-8")
          )
          if limitup_meta.get("gate_version") != GATE_VERSION:
              raise SystemExit("Premium target-gate model contract was not trained")
          if int(limitup_meta.get("artifact_version", 0) or 0) != BUNDLE_ARTIFACT_VERSION:
              raise SystemExit("Premium stable model artifact contract was not trained")
          if limitup_meta.get("validation_mode") != "purged_expanding_walk_forward_v1":
              raise SystemExit("Premium walk-forward validation contract missing")
          if int(limitup_meta.get("walk_forward_folds", 0) or 0) < 2:
              raise SystemExit("Premium walk-forward validation has too few folds")
          if int(limitup_meta.get("embargo_days", 0) or 0) < 2:
              raise SystemExit("Premium walk-forward embargo is too short")
          if len(str(limitup_meta.get("data_fingerprint", ""))) != 64:
              raise SystemExit("Premium training data fingerprint missing")
          if len(str(limitup_meta.get("feature_fingerprint", ""))) != 64:
              raise SystemExit("Premium feature fingerprint missing")
          point_in_time = limitup_meta.get("point_in_time_audit", {})
          if str(point_in_time.get("status", "")) != "PASS_D_CLOSE_PROVENANCE":
              raise SystemExit("Premium point-in-time feature audit failed")
          for fold in limitup_meta.get("fold_boundaries", []):
              if not str(fold.get("train_end", "")) < str(fold.get("valid_start", "")):
                  raise SystemExit("Premium walk-forward fold date order invalid")
              if int(fold.get("embargo_days", 0) or 0) < 2:
                  raise SystemExit("Premium walk-forward fold embargo invalid")
          target_status = limitup_meta.get("target_gate_status", {})
          if not {"t_limit", "t_touch", "t1", "t_return", "t1_return"}.issubset(target_status):
              raise SystemExit("Premium per-target model gate status missing")
          probability_status = limitup_meta.get("target_probability_status", {})
          if not {"t_limit", "t_touch", "t1"}.issubset(probability_status):
              raise SystemExit("Premium per-target probability gate status missing")
          auto_train_state = json.loads(
              Path("outputs/premium/models/auto_train_state.json").read_text(encoding="utf-8")
          )
          truth_fingerprint = str(auto_train_state.get("truth_fingerprint", ""))
          if len(truth_fingerprint) != 64:
              raise SystemExit("Premium auto-train truth fingerprint missing")
          if int(auto_train_state.get("truth_snapshot_version", 0) or 0) < 2:
              raise SystemExit("Premium auto-train truth snapshot contract is stale")

          for verify_path in sorted(Path("outputs/premium").glob("premium_verify_*.csv")):
              with verify_path.open("r", encoding="utf-8-sig", newline="") as handle:
                  header = next(csv.reader(handle), [])
              duplicates = sorted({name for name in header if header.count(name) > 1})
              if duplicates:
                  raise SystemExit(
                      f"Premium verification schema has duplicate columns: {verify_path}: {duplicates}"
                  )

          paths = [
              Path("outputs/premium/premium_final_buy_latest.csv"),
              Path("outputs/premium/premium_final_watch_latest.csv"),
              Path("outputs/premium/premium_final_reject_latest.csv"),
          ]
          frames = [pd.read_csv(path) for path in paths]
          last_run_path = Path("outputs/premium/_last_run.txt")
          last_run_text = last_run_path.read_text(encoding="utf-8")
          last_run = {}
          for line in last_run_text.splitlines():
              if ":" in line:
                  key, value = line.split(":", 1)
                  last_run[key.strip()] = value.strip()
          model_src = last_run.get("limitup_model_src", "")
          model_reason = last_run.get("limitup_model_reason", "")
          if "rule_fallback:predict_error" in model_src or model_reason.startswith("limitup_model_predict_error"):
              raise SystemExit(
                  "Premium limit-up model application failed: "
                  f"stage={last_run.get('limitup_model_error_stage', '-')}; "
                  f"type={last_run.get('limitup_model_error_type', '-')}; "
                  f"message={last_run.get('limitup_model_error_message', '-')}"
              )
          required = {
              "exec_model_ready",
              "exec_trade_eligible",
              "exec_expected_net_return",
              "t_limitup_rank_score",
              "t_limit_model_can_rank",
              "t_limit_model_probability_ready",
              "t1_model_can_rank",
              "t1_return_model_can_rank",
              "adaptive_weight_t1",
              "t1_evidence_score",
              "premium_t1_component_weight",
              "premium_candidate_state",
          }
          if not all(required.issubset(set(frame.columns)) for frame in frames):
              raise SystemExit("Premium execution-profit output contract missing")
          main_prefixes = ("000", "001", "002", "003", "600", "601", "603", "605")
          for path, frame in zip(paths, frames):
              active_raw = frame["t_limit_model_can_rank"]
              active = (
                  pd.to_numeric(active_raw, errors="coerce").fillna(0).eq(1)
                  | active_raw.astype(str).str.strip().str.lower().isin({"true", "yes", "y"})
              )
              rank_score = pd.to_numeric(frame["t_limitup_rank_score"], errors="coerce")
              if active.any() and rank_score.loc[active].isna().any():
                  raise SystemExit(
                      f"Premium active limit-up model rows are missing rank scores: {path}"
                  )
              def flag(name):
                  raw = frame[name]
                  return (
                      pd.to_numeric(raw, errors="coerce").fillna(0).eq(1)
                      | raw.astype(str).str.strip().str.lower().isin({"true", "yes", "y"})
                  )
              t1_shadow = ~(flag("t1_model_can_rank") | flag("t1_return_model_can_rank"))
              t1_evidence = pd.to_numeric(frame["t1_evidence_score"], errors="coerce")
              t1_component = pd.to_numeric(
                  frame["premium_t1_component_weight"], errors="coerce"
              )
              adaptive_t1 = pd.to_numeric(frame["adaptive_weight_t1"], errors="coerce")
              if t1_shadow.any() and (
                  (t1_evidence.loc[t1_shadow] > 1e-9).any()
                  or (t1_component.loc[t1_shadow] > 0.080001).any()
                  or (adaptive_t1.loc[t1_shadow] > 0.050001).any()
              ):
                  raise SystemExit(f"Premium SHADOW T+1 evidence was not downweighted: {path}")
              states = frame["premium_candidate_state"].dropna().astype(str)
              if not states.isin({"QUALIFIED", "RANK_ONLY", "WATCH", "NO_TRADE"}).all():
                  raise SystemExit(f"Premium candidate state contract invalid: {path}")
              qualified = states.eq("QUALIFIED")
              if qualified.any() and (t1_evidence.loc[qualified.index[qualified]] < 35.0).any():
                  raise SystemExit(f"Premium candidate qualified without T+1 evidence: {path}")
              if "premium_limit_regime" not in frame.columns:
                  raise SystemExit(f"Premium 10pct universe marker missing: {path}")
              if not frame["premium_limit_regime"].dropna().eq("MAIN_BOARD_10PCT").all():
                  raise SystemExit(f"Premium non-10pct universe marker found: {path}")
              codes = frame["ts_code"].astype(str).str.extract(r"(\d{6})", expand=False)
              suffixes = frame["ts_code"].astype(str).str.upper().str.extract(
                  r"\.([A-Z]{2})$", expand=False
              ).fillna("")
              names = frame["name"].fillna("").astype(str).str.upper()
              valid = (
                  codes.fillna("").str.startswith(main_prefixes)
                  & suffixes.isin(("", "SH", "SZ"))
                  & ~names.str.contains(r"(?:\*?ST|S\*ST|退)", regex=True, na=False)
              )
              if not valid.all():
                  bad = frame.loc[~valid, ["ts_code", "name"]].head(10)
                  raise SystemExit(
                      f"Premium candidate outside normal 10pct main board: {path}\n{bad}"
                  )

          shadow = pd.read_csv(
              "outputs/premium/verification/premium_top1_shadow_ledger.csv"
          )
          shadow_required = {
              "d_trade_date",
              "t_trade_date",
              "t1_trade_date",
              "rank",
              "ts_code",
              "buy_price",
              "sell_price",
              "net_return",
              "status",
          }
          if not shadow_required.issubset(set(shadow.columns)):
              raise SystemExit("Premium TOP1 shadow ledger contract missing")
          if shadow["d_trade_date"].astype(str).duplicated().any():
              raise SystemExit("Premium TOP1 shadow ledger has duplicate D dates")
          if not pd.to_numeric(shadow["rank"], errors="coerce").dropna().eq(1).all():
              raise SystemExit("Premium TOP1 shadow ledger contains non-TOP1 rows")

          execution_truth = pd.read_csv(
              "outputs/premium/verification/premium_execution_truth_ledger.csv"
          )
          execution_truth_required = {
              "schema_version",
              "d_trade_date",
              "t_trade_date",
              "t1_trade_date",
              "rank",
              "ts_code",
              "candidate_row_sha256",
              "auction_price",
              "sell_price",
              "net_return",
              "model_eligible",
              "status",
          }
          if not execution_truth_required.issubset(execution_truth.columns):
              raise SystemExit("Premium execution-truth ledger contract missing")
          if execution_truth.duplicated(["d_trade_date", "rank"]).any():
              raise SystemExit("Premium execution-truth ledger has duplicate frozen rank slots")
          if not execution_truth["schema_version"].astype(str).eq(EXECUTION_TRUTH_SCHEMA_VERSION).all():
              raise SystemExit("Premium execution-truth ledger schema mismatch")
          execution_backtest = json.loads(
              Path("outputs/premium/models/execution_profit_backtest_meta.json").read_text(
                  encoding="utf-8"
              )
          )
          if "proxy" in str(execution_backtest.get("entry", "")).lower():
              raise SystemExit("Premium execution backtest still uses a proxy entry")
          if "11:00" not in str(execution_backtest.get("exit", "")):
              raise SystemExit("Premium execution backtest does not use the fixed T+1 11:00 exit")
          if execution_backtest.get("schema_version") != "premium_execution_profit_walk_forward_v2":
              raise SystemExit("Premium execution walk-forward backtest contract missing")
          if execution_backtest.get("truth_source") != "premium_execution_truth_ledger.csv":
              raise SystemExit("Premium execution walk-forward backtest truth source mismatch")
          actual_top1 = json.loads(
              Path("outputs/premium/models/execution_actual_top1_backtest_meta.json").read_text(
                  encoding="utf-8"
              )
          )
          if actual_top1.get("schema_version") != "premium_execution_actual_top1_backtest_v1":
              raise SystemExit("Premium actual TOP1 baseline contract missing")
          if "proxy" in str(actual_top1.get("entry", "")).lower():
              raise SystemExit("Premium actual TOP1 baseline still uses a proxy entry")
          PY
          head -n 5 outputs/premium/premium_final_buy_latest.csv || true

          echo "=== Premium V3 last_run contract ==="
          grep -E '^ok:[[:space:]]*True' outputs/premium/_last_run.txt
          grep -E '^eret_plus_src:[[:space:]]*[^[:space:]]+' outputs/premium/_last_run.txt
          grep -E '^out_top10:[[:space:]]*[^[:space:]]+' outputs/premium/_last_run.txt
          grep -E '^out_top20:[[:space:]]*[^[:space:]]+' outputs/premium/_last_run.txt
          grep -E '^out_top30:[[:space:]]*[^[:space:]]+' outputs/premium/_last_run.txt
          grep -E '^out_full:[[:space:]]*[^[:space:]]+' outputs/premium/_last_run.txt
          grep -E '^out_verify:[[:space:]]*[^[:space:]]+' outputs/premium/_last_run.txt
          grep -E '^report_md:[[:space:]]*[^[:space:]]+' outputs/premium/_last_run.txt
          grep -E '^report_html:[[:space:]]*[^[:space:]]+' outputs/premium/_last_run.txt
          grep -E '^rank_groups:[[:space:]]*TOP10\|TOP20' outputs/premium/_last_run.txt
          grep -E '^premium_universe:[[:space:]]*MAIN_BOARD_10PCT' outputs/premium/_last_run.txt

          if [ "$PREMIUM_CMD" != "predict" ]; then
            echo "=== _last_train.txt ==="
            test -f outputs/premium/_last_train.txt
            cat outputs/premium/_last_train.txt || true

            echo "=== EHX meta contract ==="
            test -f outputs/premium/models/ehx_meta.json
            python -m json.tool outputs/premium/models/ehx_meta.json >/dev/null

            # 如果本轮训练已经声明 ehx_trained=True，则模型文件必须存在且非空。
            if grep -E '^ehx_trained:[[:space:]]*True' outputs/premium/_last_train.txt; then
              test -s outputs/premium/models/ehx_delta.joblib
            fi

            echo "=== LimitUp probability engine contract ==="
            test -f outputs/premium/models/limitup_probability_engine_meta.json
            python -m json.tool outputs/premium/models/limitup_probability_engine_meta.json >/dev/null

            # 如果本轮训练已经声明 limitup_trained=True，则模型与验证指标必须存在且非空。
            if grep -E '^limitup_trained:[[:space:]]*True' outputs/premium/_last_train.txt; then
              test -s outputs/premium/models/limitup_probability_engine.joblib
              test -s outputs/premium/models/limitup_probability_engine_metrics.csv
            fi
          fi

      - name: Commit outputs + market cache (if changed)
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 彻底清理 Python 运行时缓存。
          # 注意：仓库里如果曾经误跟踪过 pyc，这里用 checkout 恢复；未跟踪的 __pycache__ 用 clean 删除。
          git checkout -- src || true
          git clean -fd src || true
          find src -type d -name "__pycache__" -prune -exec rm -rf {} + || true
          find src -type f -name "*.pyc" -delete || true

          # 只提交 Premium 输出、模型、报告和 market cache。
          git add data/pred/pred_source_latest.csv || true
          git add data/pred/_pred_source_meta.json || true
          git add data/pred/archive || true
          git add outputs/premium || true
          git add docs/reports || true
          git add data/market || true

          echo "=== git status after cleanup + add ==="
          git status --short

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          TRADE_DATE="$(grep -E '^trade_date:' -m 1 outputs/premium/_last_run.txt | awk '{print $2}' || true)"
          if [ -z "$TRADE_DATE" ]; then
            TRADE_DATE="$(grep -E '^target_date:' -m 1 outputs/premium/_last_run.txt | awk '{print $2}' || true)"
          fi
          if [ -z "$TRADE_DATE" ]; then TRADE_DATE="unknown"; fi

          git commit -m "premium: update outputs + market cache (${TRADE_DATE})"

          # 输出提交完成后，恢复运行期产生但不应提交的缓存文件，保证 rebase 前工作区干净。
          git reset --hard HEAD
          git clean -fd src || true

          # 运行期间 main 可能被其他 workflow 推进；先 rebase 再 push。
          git fetch origin main
          git rebase -X theirs origin/main

          echo "git push origin HEAD:main"
          git push origin HEAD:main
