<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Top10 Decision Dashboard</title>
  <meta name="description" content="Top10 Decision 每日自动更新页面" />

  <style>
    :root{
      --bg:#0b1020;
      --line:rgba(255,255,255,0.08);
      --text:#e8edf7;
      --muted:#9fb0d0;
      --good:#18c37e;
      --bad:#ff6b6b;
      --warn:#ffd166;
      --shadow:0 10px 30px rgba(0,0,0,0.28);
      --radius:18px;
    }

    *{ box-sizing:border-box; }
    html, body{ margin:0; padding:0; }

    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
      background:
        radial-gradient(circle at top left, rgba(110,168,254,0.15), transparent 28%),
        radial-gradient(circle at top right, rgba(24,195,126,0.10), transparent 22%),
        linear-gradient(180deg, var(--bg), #09101d 100%);
      color:var(--text);
      min-height:100vh;
    }

    .wrap{
      width:min(1500px, calc(100vw - 32px));
      margin:24px auto 48px;
    }

    .hero,
    .card{
      background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
      border:1px solid var(--line);
      box-shadow:var(--shadow);
      backdrop-filter:blur(8px);
    }

    .hero{
      border-radius:24px;
      padding:24px;
    }

    .hero-top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:16px;
      flex-wrap:wrap;
    }

    .title{
      font-size:30px;
      line-height:1.2;
      font-weight:800;
      letter-spacing:0.2px;
      margin:0 0 8px 0;
    }

    .subtitle{
      color:var(--muted);
      font-size:14px;
      line-height:1.7;
      margin:0;
    }

    .toolbar{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }

    .btn{
      appearance:none;
      border:1px solid rgba(255,255,255,0.1);
      background:linear-gradient(180deg, #1a2445, #141d39);
      color:var(--text);
      padding:10px 14px;
      border-radius:12px;
      cursor:pointer;
      font-size:14px;
      font-weight:600;
      text-decoration:none;
      transition:0.2s ease;
      min-width:44px;
    }

    .btn:hover{
      transform:translateY(-1px);
      border-color:rgba(255,255,255,0.18);
      background:linear-gradient(180deg, #21305c, #182346);
    }

    .btn:disabled{
      opacity:0.45;
      cursor:not-allowed;
      transform:none;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(12, 1fr);
      gap:16px;
      margin-top:18px;
    }

    .card{
      grid-column:span 12;
      border-radius:var(--radius);
      overflow:hidden;
    }

    .card-body{ padding:18px 20px; }

    .report-card-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin:0 0 14px;
    }

    .report-card-head .section-title{
      margin:0;
    }

    .circle-toggle{
      appearance:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:30px;
      height:30px;
      flex:0 0 30px;
      border:1px solid rgba(207,224,255,0.35);
      border-radius:999px;
      background:rgba(110,168,254,0.14);
      color:#dce8ff;
      font-size:21px;
      font-weight:800;
      line-height:1;
      cursor:pointer;
      transition:background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }

    .circle-toggle:hover,
    .circle-toggle:focus-visible{
      border-color:rgba(207,224,255,0.68);
      background:rgba(110,168,254,0.24);
      outline:none;
      transform:translateY(-1px);
    }

    .report-section.is-collapsible{
      border:1px solid rgba(255,255,255,0.08);
      border-radius:14px;
      background:rgba(10,18,40,0.28);
      overflow:hidden;
    }

    .report-section-toggle{
      appearance:none;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      width:100%;
      border:0;
      background:transparent;
      color:var(--text);
      padding:14px 16px;
      text-align:left;
      cursor:pointer;
    }

    .report-section-toggle:hover,
    .report-section-toggle:focus-visible{
      background:rgba(110,168,254,0.08);
      outline:none;
    }

    .report-section-toggle h2{
      margin:0;
    }

    .report-section-toggle .circle-toggle{
      pointer-events:none;
    }

    .report-section-body{
      padding:0 16px 16px;
    }

    .report-section.is-collapsed .report-section-body{
      display:none;
    }

    .meta{
      display:grid;
      grid-template-columns:repeat(6, minmax(0,1fr));
      gap:12px;
    }

    .meta-item{
      background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.015));
      border:1px solid rgba(255,255,255,0.06);
      border-radius:14px;
      padding:14px;
      min-height:84px;
    }

    .meta-label{
      color:var(--muted);
      font-size:12px;
      margin-bottom:8px;
    }

    .meta-value{
      font-size:19px;
      font-weight:800;
      word-break:break-word;
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:7px 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:700;
      background:rgba(110,168,254,0.12);
      border:1px solid rgba(110,168,254,0.2);
      color:#cfe0ff;
    }

    .pill.ok{
      background:rgba(24,195,126,0.12);
      border-color:rgba(24,195,126,0.2);
      color:#b9f1d9;
    }

    .pill.bad{
      background:rgba(255,107,107,0.12);
      border-color:rgba(255,107,107,0.2);
      color:#ffd0d0;
    }

    .pill.warn{
      background:rgba(255,209,102,0.12);
      border-color:rgba(255,209,102,0.22);
      color:#ffe6a3;
    }

    .section-title{
      font-size:19px;
      font-weight:800;
      margin:0 0 14px 0;
    }

    .status-line{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      color:var(--muted);
      font-size:13px;
      margin-top:10px;
    }

    .notice{
      color:#ffe6a3;
      background:rgba(255,209,102,0.06);
      border:1px solid rgba(255,209,102,0.18);
      border-radius:14px;
      padding:12px 14px;
      margin:10px 0 16px;
      font-size:13px;
      line-height:1.7;
    }

    .empty,
    .error{
      padding:24px;
      border:1px dashed rgba(255,255,255,0.15);
      border-radius:16px;
      color:var(--muted);
      text-align:center;
    }

    .error{
      color:#ffd4d4;
      background:rgba(255,107,107,0.06);
      border-color:rgba(255,107,107,0.2);
      text-align:left;
      line-height:1.8;
    }

    .report-section{
      margin:20px 0 28px;
    }

    .report-section h2{
      font-size:20px;
      line-height:1.35;
      margin:0 0 12px;
    }

    .report-section h3{
      font-size:16px;
      color:#dce8ff;
      margin:16px 0 10px;
    }

    .kv-list{
      display:grid;
      grid-template-columns:repeat(3, minmax(0,1fr));
      gap:10px;
      margin:10px 0 18px;
    }

    .kv{
      border:1px solid rgba(255,255,255,0.07);
      background:rgba(10,18,40,0.45);
      border-radius:12px;
      padding:10px 12px;
      min-height:62px;
    }

    .kv-key{
      color:var(--muted);
      font-size:12px;
      margin-bottom:5px;
    }

    .kv-val{
      font-weight:700;
      word-break:break-word;
    }

    .table-wrap{
      width:100%;
      overflow:auto;
      border:1px solid rgba(255,255,255,0.08);
      border-radius:14px;
      background:rgba(10,18,40,0.55);
      margin:12px 0 18px;
    }

    table{
      width:100%;
      border-collapse:collapse;
      min-width:1100px;
    }

    thead th{
      position:sticky;
      top:0;
      z-index:1;
      background:#162347;
      color:#dce8ff;
      text-align:left;
      font-size:13px;
      padding:12px 12px;
      border-bottom:1px solid rgba(255,255,255,0.08);
      white-space:nowrap;
    }

    tbody td{
      padding:10px 12px;
      border-bottom:1px solid rgba(255,255,255,0.06);
      font-size:14px;
      white-space:nowrap;
    }

    tbody tr:hover{
      background:rgba(255,255,255,0.03);
    }

    td.num, th.num{
      text-align:right;
      font-variant-numeric:tabular-nums;
    }

    .pos{ color:var(--good); font-weight:700; }
    .neg{ color:var(--bad); font-weight:700; }
    .muted{ color:var(--muted); }

    pre.raw{
      white-space:pre-wrap;
      word-break:break-word;
      background:#0a1228;
      border:1px solid rgba(255,255,255,0.08);
      border-radius:14px;
      padding:14px;
      overflow:auto;
      color:#dce8ff;
      max-height:480px;
    }

    .footer{
      margin-top:16px;
      color:var(--muted);
      font-size:12px;
      text-align:center;
    }

    @media (max-width:1200px){
      .meta{ grid-template-columns:repeat(3, minmax(0,1fr)); }
      .kv-list{ grid-template-columns:repeat(2, minmax(0,1fr)); }
    }

    @media (max-width:720px){
      .wrap{
        width:min(100vw - 20px, 100%);
        margin:10px auto 28px;
      }

      .hero{
        padding:16px;
        border-radius:18px;
      }

      .title{ font-size:24px; }
      .meta{ grid-template-columns:repeat(2, minmax(0,1fr)); }
      .kv-list{ grid-template-columns:1fr; }
      .meta-value{ font-size:17px; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <section class="hero">
      <div class="hero-top">
        <div>
          <h1 class="title">Top10 Decision Dashboard</h1>
          <p class="subtitle">
            自动读取并渲染最新的 Decision 报告。<br />
            本版专门兼容报告被压成一整行的情况，直接解析三张核心表。
          </p>
        </div>

        <div class="toolbar">
          <button class="btn" id="prevBtn" title="上一份">←</button>
          <button class="btn" id="refreshBtn">刷新</button>
          <button class="btn" id="nextBtn" title="下一份">→</button>
        </div>
      </div>

      <div class="status-line">
        <span class="pill" id="statusPill">初始化中</span>
        <span id="statusText">正在定位报告...</span>
      </div>
    </section>

    <div class="grid">
      <section class="card">
        <div class="card-body">
          <div class="meta" id="metaGrid"></div>
        </div>
      </section>

      <section class="card" id="reportCard">
        <div class="card-body">
          <div id="reportBox" class="empty">等待加载...</div>
        </div>
      </section>
    </div>

    <div class="footer">
      <span id="footerText">Top10 Decision · 动态页面</span>
    </div>
  </div>

  <script>
    "use strict";

    const REPO = {
      owner: "njedu2023-prog",
      name: "top10-decision",
      branch: "main",
      reportDir: "outputs/decision"
    };

    const RAW_BASE = `https://raw.githubusercontent.com/${REPO.owner}/${REPO.name}/${REPO.branch}`;
    const API_LIST_URL = `https://api.github.com/repos/${REPO.owner}/${REPO.name}/contents/${REPO.reportDir}?ref=${REPO.branch}`;
    const CACHE_KEY = "top10_decision_last_report_v3";

    const statusPill = document.getElementById("statusPill");
    const statusText = document.getElementById("statusText");
    const reportBox = document.getElementById("reportBox");
    const metaGrid = document.getElementById("metaGrid");
    const footerText = document.getElementById("footerText");
    const refreshBtn = document.getElementById("refreshBtn");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    let reportFiles = [];
    let currentIndex = 0;
    let currentFileName = "";
    let lastLoadMode = "";

    function setReportSectionCollapsed(section, collapsed) {
      const toggle = section.querySelector(".report-section-toggle");
      const icon = section.querySelector(".report-section-toggle .circle-toggle");
      const title = section.getAttribute("data-section-title") || "本节";
      section.classList.toggle("is-collapsed", collapsed);
      if (toggle) {
        toggle.setAttribute("aria-expanded", String(!collapsed));
        toggle.title = `${collapsed ? "展开" : "折叠"}${title}`;
      }
      if (icon) icon.textContent = collapsed ? "+" : "-";
    }

    function bindReportSectionToggles(root) {
      root.querySelectorAll(".report-section.is-collapsible").forEach(section => {
        const toggle = section.querySelector(".report-section-toggle");
        if (!toggle) return;
        setReportSectionCollapsed(section, section.classList.contains("is-collapsed"));
        toggle.addEventListener("click", () => {
          setReportSectionCollapsed(section, !section.classList.contains("is-collapsed"));
        });
      });
    }

    function collapsibleSectionHtml(title, bodyHtml, collapsed = true) {
      const safeTitle = escapeHtml(title);
      return `
        <div class="report-section is-collapsible${collapsed ? " is-collapsed" : ""}" data-section-title="${safeTitle}">
          <button class="report-section-toggle" type="button" aria-expanded="${collapsed ? "false" : "true"}" title="${collapsed ? "展开" : "折叠"}${safeTitle}">
            <h2>${safeTitle}</h2>
            <span class="circle-toggle" aria-hidden="true">${collapsed ? "+" : "-"}</span>
          </button>
          <div class="report-section-body">
            ${bodyHtml}
          </div>
        </div>
      `;
    }

    function saveCachedReport(info, mdRaw) {
      try {
        localStorage.setItem(CACHE_KEY, JSON.stringify({
          savedAt: Date.now(),
          info,
          mdRaw
        }));
      } catch (err) {
        console.warn("Decision report cache write failed.", err);
      }
    }

    function loadCachedReport() {
      try {
        const raw = localStorage.getItem(CACHE_KEY);
        if (!raw) return null;
        const cached = JSON.parse(raw);
        if (!cached || !cached.info || typeof cached.mdRaw !== "string") return null;
        return cached;
      } catch (err) {
        console.warn("Decision report cache read failed.", err);
        return null;
      }
    }

    function setStatus(type, text) {
      statusPill.className = `pill ${type || ""}`.trim();
      statusPill.textContent = type === "ok" ? "加载成功" : type === "bad" ? "加载失败" : type === "warn" ? "回退模式" : "加载中";
      statusText.textContent = text || "";
    }

    function escapeHtml(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function stripMd(s) {
      return String(s ?? "")
        .replace(/\*\*/g, "")
        .replace(/`/g, "")
        .trim();
    }

    function formatDateYmd(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}${m}${day}`;
    }

    function todayYmd() {
      return formatDateYmd(new Date());
    }

    function reportDateFromName(name) {
      const m = String(name || "").match(/^decision_report_(\d{8})\.md$/);
      return m ? m[1] : "";
    }

    function isCurrentOrPastReport(name) {
      const ymd = reportDateFromName(name);
      return Boolean(ymd && ymd <= todayYmd());
    }

    function getDateCandidates(daysBack = 60) {
      const out = [];
      const d = new Date();
      const offsets = [0];
      for (let i = 1; i <= daysBack; i += 1) offsets.push(-i);

      for (const i of offsets) {
        const x = new Date(d);
        x.setDate(d.getDate() + i);
        out.push(formatDateYmd(x));
      }
      return out;
    }

    async function fetchText(url) {
      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) throw new Error(`请求失败: ${res.status} ${res.statusText}`);
      return await res.text();
    }

    async function fetchJson(url) {
      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) throw new Error(`请求失败: ${res.status} ${res.statusText}`);
      return await res.json();
    }

    function parseCsvLine(line) {
      const out = [];
      let cur = "";
      let quoted = false;
      const s = String(line || "");

      for (let i = 0; i < s.length; i += 1) {
        const ch = s[i];
        const next = s[i + 1];
        if (ch === '"' && quoted && next === '"') {
          cur += '"';
          i += 1;
        } else if (ch === '"') {
          quoted = !quoted;
        } else if (ch === "," && !quoted) {
          out.push(cur);
          cur = "";
        } else {
          cur += ch;
        }
      }
      out.push(cur);
      return out.map(x => x.trim());
    }

    function csvTextToRows(csvText) {
      const lines = String(csvText || "")
        .replace(/\r\n/g, "\n")
        .replace(/\r/g, "\n")
        .split("\n")
        .filter(line => line.trim() !== "");
      if (lines.length < 2) return [];

      const header = parseCsvLine(lines[0]).map(x => x.replace(/^\ufeff/, ""));
      return lines.slice(1).map(line => {
        const cells = parseCsvLine(line);
        const row = {};
        header.forEach((key, idx) => {
          row[key] = cells[idx] ?? "";
        });
        return row;
      });
    }

    function normalizeArtifactPath(path) {
      return String(path || "")
        .replace(/^`|`$/g, "")
        .replace(/^\.?\//, "")
        .trim();
    }

    function firstNonEmpty(row, keys) {
      for (const key of keys) {
        const v = row && row[key] != null ? String(row[key]).trim() : "";
        if (v) return v;
      }
      return "";
    }

    async function loadIndustryMap(fields) {
      const path = normalizeArtifactPath(fields && fields.candidates_snapshot);
      if (!path || !/\.csv$/i.test(path)) return {};

      try {
        const csv = await fetchText(`${RAW_BASE}/${path}`);
        const rows = csvTextToRows(csv);
        const map = {};
        rows.forEach(row => {
          const code = firstNonEmpty(row, ["ts_code", "code", "symbol"]);
          const industry = firstNonEmpty(row, ["industry", "board", "industry_tag", "sector", "concept"]);
          if (code && industry && !map[code]) map[code] = industry;
        });
        return map;
      } catch (err) {
        console.warn("Decision industry map load failed.", err);
        return {};
      }
    }

    function normalizeReport(md) {
      let s = String(md || "")
        .replace(/\r\n/g, "\n")
        .replace(/\r/g, "\n")
        .trim();

      /*
       * 核心修复：
       * 当前报告文件可能整份被压缩成 1 行。
       * 必须先把标题、二级标题、元数据、表格行重新拆开，否则页面会一直像“没有数据”。
       *
       * 注意：不能把所有 "| 数字 |" 都当成新行。
       * 因为 weight=0 也会出现 "| 0 |"，粗暴拆分会导致 rank/ts_code/name 和 EV/P_fill 等字段错位。
       * 所以股票数据行只在 "| rank | 000000.SZ/SH/BJ |" 这种结构前拆行。
       */
      s = s
        .replace(/\s+(##\s+)/g, "\n\n$1")
        .replace(/\s+(-\s+[A-Za-z_][A-Za-z0-9_]*:\s+)/g, "\n$1")
        .replace(/\s+(\|\s*rank\s*\|)/gi, "\n$1")
        .replace(/\s+(\|\s*:?-{3,}:?\s*\|)/g, "\n$1")
        .replace(/\s+(\|\s*\d+\s*\|\s*\d{6}\.(?:SZ|SH|BJ)\s*\|)/g, "\n$1");

      return s.trim();
    }

    function extractTitleDate(md) {
      const m = md.match(/#\s*Decision Report\s*\((\d{8})\)/i);
      return m ? m[1] : "";
    }

    function extractField(md, key) {
      const patterns = [
        new RegExp(`(?:^|\\n)-\\s*${key}:\\s*\\*\\*(.*?)\\*\\*`, "i"),
        new RegExp(`(?:^|\\s)-\\s*${key}:\\s*\\*\\*(.*?)\\*\\*`, "i"),
        new RegExp(`(?:^|\\n)-\\s*${key}:\\s*` + "`([^`]+)`", "i"),
        new RegExp(`(?:^|\\s)-\\s*${key}:\\s*` + "`([^`]+)`", "i"),
        new RegExp(`(?:^|\\n)-\\s*${key}:\\s*([^\\n]+)`, "i"),
        new RegExp(`${key}:\\s*\\*\\*(.*?)\\*\\*`, "i")
      ];

      for (const re of patterns) {
        const m = md.match(re);
        if (m) return stripMd(m[1]);
      }
      return "";
    }

    function extractFields(md) {
      const keys = [
        "signal_date",
        "exec_date",
        "requested_trade_date",
        "regime",
        "risk_budget",
        "input_mode",
        "fs_degrade_reason",
        "pred_loaded",
        "pred_rows",
        "features_base_loaded",
        "features_base_rows",
        "features_limit_loaded",
        "features_limit_rows",
        "truth_close_loaded",
        "truth_close_rows",
        "meta_loaded",
        "p_fill_pred_src",
        "p_fill_model_loaded",
        "p_fill_model_kind",
        "p_fill_degrade_reason",
        "eret_pred_src",
        "eret_model_loaded",
        "eret_model_kind",
        "eret_degrade_reason",
        "candidates_snapshot",
        "execution_table",
        "learning_table",
        "weights_latest",
        "weights_dated",
        "top_evr_latest",
        "top_evr_dated"
      ];

      const out = { report_date: extractTitleDate(md) };
      keys.forEach(key => out[key] = extractField(md, key));
      return out;
    }

    function splitRow(line) {
      return String(line)
        .trim()
        .replace(/^\|/, "")
        .replace(/\|$/, "")
        .split("|")
        .map(x => stripMd(x));
    }

    function isSeparatorRow(line) {
      return /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(String(line).trim());
    }

    function parseSectionTable(md, sectionName) {
      const safe = sectionName.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      const re = new RegExp(`##\\s+${safe}\\s*\\n([\\s\\S]*?)(?=\\n##\\s+|$)`, "i");
      const m = md.match(re);
      if (!m) return { header: [], rows: [] };

      const lines = m[1]
        .split("\n")
        .map(x => x.trim())
        .filter(Boolean)
        .filter(x => x.startsWith("|"));

      if (lines.length < 2) return { header: [], rows: [] };

      const headerLine = lines.find(x => /\|\s*rank\s*\|/i.test(x)) || lines[0];
      const header = splitRow(headerLine);

      const rows = lines
        .filter(x => x !== headerLine)
        .filter(x => !isSeparatorRow(x))
        .map(splitRow)
        .filter(row => row.length >= 3 && /^\d+$/.test(row[0]));

      return { header, rows };
    }

    function tableWithIndustry(table, industryMap) {
      if (!table || !Array.isArray(table.header) || !Array.isArray(table.rows)) return table;

      const keys = table.header.map(h => String(h).toLowerCase());
      const nameIdx = keys.indexOf("name");
      const codeIdx = keys.indexOf("ts_code");
      if (nameIdx < 0 || codeIdx < 0 || keys.includes("industry") || keys.includes("行业板块")) return table;

      const header = table.header.slice();
      header.splice(nameIdx + 1, 0, "行业板块");

      const rows = table.rows.map(row => {
        const next = row.slice();
        const code = String(row[codeIdx] || "").trim();
        next.splice(nameIdx + 1, 0, industryMap && industryMap[code] ? industryMap[code] : "");
        return next;
      });

      return { header, rows };
    }

    function tableHtml(table, emptyText) {
      if (!table || !table.header || table.header.length === 0) {
        return `<div class="empty">${escapeHtml(emptyText || "未解析到表格")}</div>`;
      }

      if (!table.rows || table.rows.length === 0) {
        return `<div class="empty">${escapeHtml(emptyText || "该表当前为空")}</div>`;
      }

      const numericKeys = new Set(["rank", "weight", "ev", "p_fill", "e_ret", "cost", "riskpenalty"]);
      const keys = table.header.map(h => String(h).toLowerCase());

      const th = table.header.map((h, idx) => {
        const cls = numericKeys.has(keys[idx]) ? ' class="num"' : "";
        return `<th${cls}>${escapeHtml(h)}</th>`;
      }).join("");

      const tr = table.rows.map(row => {
        return `<tr>${table.header.map((_, idx) => {
          const key = keys[idx];
          const val = row[idx] ?? "";
          const n = Number(String(val).replace("%", ""));
          const classes = [];
          if (numericKeys.has(key)) classes.push("num");
          if ((key === "ev" || key === "e_ret") && Number.isFinite(n)) {
            if (n > 0) classes.push("pos");
            if (n < 0) classes.push("neg");
          }
          return `<td${classes.length ? ` class="${classes.join(" ")}"` : ""}>${escapeHtml(val)}</td>`;
        }).join("")}</tr>`;
      }).join("");

      return `<div class="table-wrap"><table><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table></div>`;
    }

    function kvHtml(fields, keys) {
      return `<div class="kv-list">${keys.map(([key, label]) => `
        <div class="kv">
          <div class="kv-key">${escapeHtml(label)}</div>
          <div class="kv-val">${escapeHtml(fields[key] || "-")}</div>
        </div>
      `).join("")}</div>`;
    }

    function buildMetaCard(label, value) {
      return `
        <div class="meta-item">
          <div class="meta-label">${escapeHtml(label)}</div>
          <div class="meta-value">${escapeHtml(value == null || value === "" ? "-" : value)}</div>
        </div>
      `;
    }

    function renderMeta(fields, evRows, topRows, fullRows) {
      metaGrid.innerHTML = [
        buildMetaCard("报告日期", fields.report_date || "-"),
        buildMetaCard("信号日", fields.signal_date || "-"),
        buildMetaCard("执行日", fields.exec_date || "-"),
        buildMetaCard("市场状态", fields.regime || "-"),
        buildMetaCard("风险预算", fields.risk_budget || "-"),
        buildMetaCard("输入模式", fields.input_mode || "-"),
        buildMetaCard("EV筛选数量", String(evRows)),
        buildMetaCard("TopN数量", String(topRows)),
        buildMetaCard("候选池数量", String(fullRows)),
        buildMetaCard("P_fill来源", fields.p_fill_pred_src || "-"),
        buildMetaCard("E_ret来源", fields.eret_pred_src || "-"),
        buildMetaCard("当前文件", currentFileName || "-")
      ].join("");
    }

    function renderReport(mdRaw, industryMap = {}) {
      const md = normalizeReport(mdRaw);
      const fields = extractFields(md);
      const evTable = tableWithIndustry(parseSectionTable(md, "EV > 3% & RiskPenalty < 1%"), industryMap);
      const topnTable = tableWithIndustry(parseSectionTable(md, "TopN Targets"), industryMap);
      const fullTable = tableWithIndustry(parseSectionTable(md, "Full Candidate Pool"), industryMap);

      renderMeta(
        fields,
        evTable.rows.length,
        topnTable.rows.length,
        fullTable.rows.length
      );

      const rawNotice = mdRaw.split(/\r?\n/).length <= 2
        ? `<div class="notice">检测到报告文件被压成一整行；本页面已启用强制拆分解析，所以 Full Candidate Pool 等表格仍可显示。</div>`
        : "";

      reportBox.className = "";
      reportBox.innerHTML = `
        ${rawNotice}

        ${collapsibleSectionHtml("报告正文", `
          <div class="report-section">
            <h2>报告状态</h2>
            ${kvHtml(fields, [
              ["signal_date", "信号日"],
              ["exec_date", "执行日"],
              ["requested_trade_date", "请求交易日"],
              ["regime", "市场状态"],
              ["risk_budget", "风险预算"],
              ["input_mode", "输入模式"],
              ["fs_degrade_reason", "FS降级原因"],
              ["pred_loaded", "pred_loaded"],
              ["pred_rows", "pred_rows"],
              ["features_base_rows", "features_base_rows"],
              ["features_limit_rows", "features_limit_rows"],
              ["truth_close_rows", "truth_close_rows"]
            ])}
          </div>

          <div class="report-section">
            <h2>模型状态</h2>
            ${kvHtml(fields, [
              ["p_fill_pred_src", "P_fill来源"],
              ["p_fill_model_loaded", "P_fill模型加载"],
              ["p_fill_model_kind", "P_fill模型类型"],
              ["p_fill_degrade_reason", "P_fill降级原因"],
              ["eret_pred_src", "E_ret来源"],
              ["eret_model_loaded", "E_ret模型加载"],
              ["eret_model_kind", "E_ret模型类型"],
              ["eret_degrade_reason", "E_ret降级原因"]
            ])}
          </div>
        `, true)}

        ${collapsibleSectionHtml("Artifacts", kvHtml(fields, [
          ["candidates_snapshot", "候选快照"],
          ["execution_table", "执行表"],
          ["learning_table", "学习表"],
          ["weights_latest", "weights_latest"],
          ["weights_dated", "weights_dated"],
          ["top_evr_latest", "TopEVR_latest"],
          ["top_evr_dated", "TopEVR_dated"]
        ]), true)}

        <div class="report-section">
          <h2>EV &gt; 3% &amp; RiskPenalty &lt; 1%</h2>
          ${tableHtml(evTable, "该严格筛选表当前为空：没有股票同时满足 EV > 3% 且 RiskPenalty < 1%。")}
        </div>

        <div class="report-section">
          <h2>TopN Targets</h2>
          ${tableHtml(topnTable, "TopN Targets 当前为空。")}
        </div>

        <div class="report-section">
          <h2>Full Candidate Pool</h2>
          ${tableHtml(fullTable, "Full Candidate Pool 当前未解析到数据。")}
        </div>

        <div class="report-section">
          <h2>原始报告预览</h2>
          <pre class="raw">${escapeHtml(md.slice(0, 8000))}</pre>
        </div>
      `;
      bindReportSectionToggles(reportBox);
    }

    async function renderReportWithIndustry(mdRaw) {
      const fields = extractFields(normalizeReport(mdRaw));
      const industryMap = await loadIndustryMap(fields);
      renderReport(mdRaw, industryMap);
    }

    function updateNavButtons() {
      prevBtn.disabled = currentIndex >= reportFiles.length - 1;
      nextBtn.disabled = currentIndex <= 0;
    }

    async function getReportFilesFromApi() {
      const files = await fetchJson(API_LIST_URL);
      const rows = Array.isArray(files) ? files : [];

      return rows
        .filter(x => x && x.type === "file" && /^decision_report_\d{8}\.md$/.test(x.name))
        .filter(x => isCurrentOrPastReport(x.name))
        .sort((a, b) => b.name.localeCompare(a.name))
        .map(x => ({
          name: x.name,
          path: x.path,
          rawUrl: x.download_url || `${RAW_BASE}/${x.path}`
        }));
    }

    function getFallbackReportFiles() {
      return getDateCandidates(60).map(ymd => ({
        name: `decision_report_${ymd}.md`,
        path: `${REPO.reportDir}/decision_report_${ymd}.md`,
        rawUrl: `${RAW_BASE}/${REPO.reportDir}/decision_report_${ymd}.md`
      }));
    }

    async function ensureReportList() {
      if (reportFiles.length > 0) return;

      try {
        setStatus("", "正在通过 GitHub API 定位报告列表...");
        reportFiles = await getReportFilesFromApi();
        lastLoadMode = "api-list";
      } catch (err) {
        console.warn("GitHub API list failed; using raw date probing.", err);
        reportFiles = getFallbackReportFiles();
        lastLoadMode = "raw-date-fallback";
      }

      if (!reportFiles.length) {
        reportFiles = getFallbackReportFiles();
        lastLoadMode = "raw-date-fallback";
      }
    }

    async function loadReportByIndex(index) {
      try {
        await ensureReportList();

        currentIndex = Math.max(0, Math.min(index, reportFiles.length - 1));
        updateNavButtons();

        reportBox.className = "empty";
        reportBox.innerHTML = "正在加载...";
        metaGrid.innerHTML = "";

        let lastErr = null;

        for (let i = currentIndex; i < reportFiles.length; i += 1) {
          const info = reportFiles[i];
          currentIndex = i;
          currentFileName = info.name;
          updateNavButtons();

          try {
            setStatus("", `正在读取：${info.name}`);
            const mdRaw = await fetchText(info.rawUrl);
            await renderReportWithIndustry(mdRaw);
            saveCachedReport(info, mdRaw);
            setStatus("ok", `加载成功：${info.name}（${currentIndex + 1}/${reportFiles.length}）`);
            footerText.textContent = `Top10 Decision · ${info.name} · 最近刷新：${new Date().toLocaleString("zh-CN")}`;
            return;
          } catch (err) {
            lastErr = err;
            console.warn(`Report not loaded: ${info.name}`, err);
            if (lastLoadMode !== "raw-date-fallback") break;
          }
        }

        throw lastErr || new Error("未找到可读取的 decision_report_YYYYMMDD.md");
      } catch (err) {
        console.error(err);
        const cached = loadCachedReport();
        if (cached) {
          currentFileName = cached.info.name || "cached_report";
          reportFiles = [cached.info];
          currentIndex = 0;
          updateNavButtons();
          await renderReportWithIndustry(cached.mdRaw);
          setStatus("warn", `已显示本地缓存：${currentFileName}`);
          footerText.textContent = `Top10 Decision · ${currentFileName} · 缓存时间：${new Date(cached.savedAt || Date.now()).toLocaleString("zh-CN")}`;
          return;
        }
        setStatus("bad", "页面加载失败");
        reportBox.className = "error";
        reportBox.innerHTML = `
          <strong>页面加载失败</strong><br><br>
          ${escapeHtml(err?.message || String(err))}<br><br>
          请检查：<br>
          1. 仓库是否公开；<br>
          2. outputs/decision/ 下是否已有 decision_report_YYYYMMDD.md；<br>
          3. GitHub raw 或 GitHub API 是否临时限流；<br>
          4. 浏览器是否阻止跨域 fetch。
        `;
        metaGrid.innerHTML = "";
      }
    }

    refreshBtn.addEventListener("click", () => {
      reportFiles = [];
      currentIndex = 0;
      loadReportByIndex(0);
    });

    prevBtn.addEventListener("click", () => loadReportByIndex(currentIndex + 1));
    nextBtn.addEventListener("click", () => loadReportByIndex(currentIndex - 1));

    window.addEventListener("error", event => {
      console.error("Global page error:", event.error || event.message);
      setStatus("bad", "页面脚本异常");
      reportBox.className = "error";
      reportBox.innerHTML = `
        <strong>页面脚本异常</strong><br><br>
        ${escapeHtml(event.message || "未知脚本错误")}
      `;
    });

    setStatus("", "正在定位报告...");
    loadReportByIndex(0);
  </script>
</body>
</html>
