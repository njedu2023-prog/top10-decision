<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Top10 Decision Dashboard</title>
  <meta name="description" content="Top10 Decision 每日自动更新页面" />

  <style>
    :root{
      --bg:#0b1020;
      --line:rgba(255,255,255,0.08);
      --text:#e8edf7;
      --muted:#9fb0d0;
      --good:#18c37e;
      --bad:#ff6b6b;
      --warn:#ffd166;
      --shadow:0 10px 30px rgba(0,0,0,0.28);
      --radius:18px;
    }

    *{ box-sizing:border-box; }
    html, body{ margin:0; padding:0; }

    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
      background:
        radial-gradient(circle at top left, rgba(110,168,254,0.15), transparent 28%),
        radial-gradient(circle at top right, rgba(24,195,126,0.10), transparent 22%),
        linear-gradient(180deg, var(--bg), #09101d 100%);
      color:var(--text);
      min-height:100vh;
    }

    .wrap{
      width:min(1400px, calc(100vw - 32px));
      margin:24px auto 48px;
    }

    .hero{
      background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
      border:1px solid var(--line);
      border-radius:24px;
      padding:24px;
      box-shadow:var(--shadow);
      backdrop-filter:blur(8px);
    }

    .hero-top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:16px;
      flex-wrap:wrap;
    }

    .title{
      font-size:30px;
      line-height:1.2;
      font-weight:800;
      letter-spacing:0.2px;
      margin:0 0 8px 0;
    }

    .subtitle{
      color:var(--muted);
      font-size:14px;
      line-height:1.7;
      margin:0;
    }

    .toolbar{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }

    .btn{
      appearance:none;
      border:1px solid rgba(255,255,255,0.1);
      background:linear-gradient(180deg, #1a2445, #141d39);
      color:var(--text);
      padding:10px 14px;
      border-radius:12px;
      cursor:pointer;
      font-size:14px;
      font-weight:600;
      text-decoration:none;
      transition:0.2s ease;
      min-width:44px;
    }

    .btn:hover{
      transform:translateY(-1px);
      border-color:rgba(255,255,255,0.18);
      background:linear-gradient(180deg, #21305c, #182346);
    }

    .btn:disabled{
      opacity:0.45;
      cursor:not-allowed;
      transform:none;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(12, 1fr);
      gap:16px;
      margin-top:18px;
    }

    .card{
      grid-column:span 12;
      background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .card-body{ padding:18px 20px; }

    .meta{
      display:grid;
      grid-template-columns:repeat(6, minmax(0,1fr));
      gap:12px;
    }

    .meta-item{
      background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.015));
      border:1px solid rgba(255,255,255,0.06);
      border-radius:14px;
      padding:14px;
      min-height:84px;
    }

    .meta-label{
      color:var(--muted);
      font-size:12px;
      margin-bottom:8px;
    }

    .meta-value{
      font-size:20px;
      font-weight:800;
      word-break:break-word;
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:7px 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:700;
      background:rgba(110,168,254,0.12);
      border:1px solid rgba(110,168,254,0.2);
      color:#cfe0ff;
    }

    .pill.ok{
      background:rgba(24,195,126,0.12);
      border-color:rgba(24,195,126,0.2);
      color:#b9f1d9;
    }

    .pill.bad{
      background:rgba(255,107,107,0.12);
      border-color:rgba(255,107,107,0.2);
      color:#ffd0d0;
    }

    .pill.warn{
      background:rgba(255,209,102,0.12);
      border-color:rgba(255,209,102,0.22);
      color:#ffe6a3;
    }

    .section-title{
      font-size:18px;
      font-weight:800;
      margin:0 0 14px 0;
    }

    .status-line{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      color:var(--muted);
      font-size:13px;
      margin-top:10px;
    }

    .markdown{
      line-height:1.8;
      color:var(--text);
    }

    .markdown h1,
    .markdown h2,
    .markdown h3{
      margin:22px 0 12px;
      line-height:1.35;
    }

    .markdown h1{ font-size:24px; }
    .markdown h2{ font-size:20px; }
    .markdown h3{ font-size:16px; }

    .markdown p,
    .markdown ul,
    .markdown ol{
      margin:10px 0;
    }

    .markdown ul{
      padding-left:20px;
    }

    .markdown li{
      margin:4px 0;
    }

    .markdown code{
      background:rgba(255,255,255,0.06);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:8px;
      padding:2px 6px;
      font-size:13px;
    }

    .markdown pre{
      background:#0a1228;
      border:1px solid rgba(255,255,255,0.08);
      border-radius:14px;
      padding:14px;
      overflow:auto;
    }

    .table-wrap{
      width:100%;
      overflow:auto;
      border:1px solid rgba(255,255,255,0.08);
      border-radius:14px;
      background:rgba(10,18,40,0.55);
      margin:12px 0 18px;
    }

    table{
      width:100%;
      border-collapse:collapse;
      min-width:1100px;
    }

    thead th{
      position:sticky;
      top:0;
      z-index:1;
      background:#162347;
      color:#dce8ff;
      text-align:left;
      font-size:13px;
      padding:12px 12px;
      border-bottom:1px solid rgba(255,255,255,0.08);
      white-space:nowrap;
    }

    tbody td{
      padding:10px 12px;
      border-bottom:1px solid rgba(255,255,255,0.06);
      font-size:14px;
      white-space:nowrap;
    }

    tbody tr:hover{
      background:rgba(255,255,255,0.03);
    }

    td.num, th.num{
      text-align:right;
      font-variant-numeric:tabular-nums;
    }

    .pos{ color:var(--good); font-weight:700; }
    .neg{ color:var(--bad); font-weight:700; }
    .muted{ color:var(--muted); }

    .empty,
    .error{
      padding:24px;
      border:1px dashed rgba(255,255,255,0.15);
      border-radius:16px;
      color:var(--muted);
      text-align:center;
    }

    .error{
      color:#ffd4d4;
      background:rgba(255,107,107,0.06);
      border-color:rgba(255,107,107,0.2);
      text-align:left;
    }

    .notice{
      color:#ffe6a3;
      background:rgba(255,209,102,0.06);
      border:1px solid rgba(255,209,102,0.18);
      border-radius:14px;
      padding:12px 14px;
      margin:10px 0 16px;
      font-size:13px;
    }

    .footer{
      margin-top:16px;
      color:var(--muted);
      font-size:12px;
      text-align:center;
    }

    @media (max-width:1200px){
      .meta{ grid-template-columns:repeat(3, minmax(0,1fr)); }
    }

    @media (max-width:720px){
      .wrap{
        width:min(100vw - 20px, 100%);
        margin:10px auto 28px;
      }

      .hero{
        padding:16px;
        border-radius:18px;
      }

      .title{ font-size:24px; }
      .meta{ grid-template-columns:repeat(2, minmax(0,1fr)); }
      .meta-value{ font-size:17px; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <section class="hero">
      <div class="hero-top">
        <div>
          <h1 class="title">Top10 Decision Dashboard</h1>
          <p class="subtitle">
            自动读取并渲染最新的 Decision Markdown 报告。<br />
            优先读取最新报告，失败时自动回退最近日期；不再依赖外部 Markdown CDN。
          </p>
        </div>

        <div class="toolbar">
          <button class="btn" id="prevBtn" title="上一份">←</button>
          <button class="btn" id="refreshBtn">刷新</button>
          <button class="btn" id="nextBtn" title="下一份">→</button>
        </div>
      </div>

      <div class="status-line">
        <span class="pill" id="statusPill">初始化中</span>
        <span id="statusText">正在定位报告...</span>
      </div>
    </section>

    <div class="grid">
      <section class="card">
        <div class="card-body">
          <div class="meta" id="metaGrid"></div>
        </div>
      </section>

      <section class="card">
        <div class="card-body">
          <h2 class="section-title">报告正文</h2>
          <div id="reportBox" class="markdown empty">等待加载...</div>
        </div>
      </section>
    </div>

    <div class="footer">
      <span id="footerText">Top10 Decision · 动态页面</span>
    </div>
  </div>

  <script>
    "use strict";

    const REPO = {
      owner: "njedu2023-prog",
      name: "top10-decision",
      branch: "main",
      reportDir: "outputs/decision"
    };

    const RAW_BASE = `https://raw.githubusercontent.com/${REPO.owner}/${REPO.name}/${REPO.branch}`;
    const API_LIST_URL = `https://api.github.com/repos/${REPO.owner}/${REPO.name}/contents/${REPO.reportDir}?ref=${REPO.branch}`;

    const statusPill = document.getElementById("statusPill");
    const statusText = document.getElementById("statusText");
    const reportBox = document.getElementById("reportBox");
    const metaGrid = document.getElementById("metaGrid");
    const footerText = document.getElementById("footerText");
    const refreshBtn = document.getElementById("refreshBtn");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    let reportFiles = [];
    let currentIndex = 0;
    let currentFileName = "";
    let lastLoadMode = "";

    function setStatus(type, text) {
      statusPill.className = `pill ${type || ""}`.trim();
      statusPill.textContent = type === "ok" ? "加载成功" : type === "bad" ? "加载失败" : type === "warn" ? "回退模式" : "加载中";
      statusText.textContent = text || "";
    }

    function escapeHtml(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function inlineMd(s) {
      return escapeHtml(s)
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    }

    function classForSigned(v) {
      const n = Number(String(v).replace("%", ""));
      if (!Number.isFinite(n)) return "";
      if (n > 0) return "pos";
      if (n < 0) return "neg";
      return "";
    }

    function formatDateYmd(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}${m}${day}`;
    }

    function getDateCandidates(daysBack = 45) {
      const out = [];
      const d = new Date();
      for (let i = 0; i <= daysBack; i += 1) {
        const x = new Date(d);
        x.setDate(d.getDate() - i);
        out.push(formatDateYmd(x));
      }
      return out;
    }

    async function fetchText(url) {
      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) {
        throw new Error(`请求失败: ${res.status} ${res.statusText}`);
      }
      return await res.text();
    }

    async function fetchJson(url) {
      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) {
        throw new Error(`请求失败: ${res.status} ${res.statusText}`);
      }
      return await res.json();
    }

    function normalizeMarkdown(md) {
      let s = String(md || "").replace(/\r\n/g, "\n").replace(/\r/g, "\n").trim();

      /*
       * 兼容一种常见坏格式：
       * 生成脚本把整份 Markdown 压成一行，导致标题、元数据、表格无法正常渲染。
       * 这里在不改变文本含义的前提下补回结构换行。
       */
      s = s
        .replace(/\s+(#{1,6}\s+)/g, "\n\n$1")
        .replace(/\s+(-\s+[A-Za-z_][A-Za-z0-9_]*:\s+)/g, "\n$1")
        .replace(/\s+(\|\s*[-:| ]+\s*\|)/g, "\n$1")
        .replace(/\s+(\|\s*\d+\s*\|)/g, "\n$1")
        .replace(/\s+(\|\s*rank\s*\|)/gi, "\n$1");

      return s.trim();
    }

    function extractSimpleFields(md) {
      const out = {};
      const fields = [
        "signal_date",
        "exec_date",
        "requested_trade_date",
        "regime",
        "risk_budget",
        "input_mode",
        "fs_degrade_reason",
        "p_fill_pred_src",
        "p_fill_model_loaded",
        "p_fill_model_kind",
        "p_fill_degrade_reason",
        "eret_pred_src",
        "eret_model_loaded",
        "eret_model_kind",
        "eret_degrade_reason"
      ];

      for (const key of fields) {
        const re = new RegExp(`(?:^|\\n)-\\s*${key}:\\s*\\*\\*(.*?)\\*\\*`, "i");
        const m = md.match(re);
        if (m) out[key] = m[1].trim();
      }

      const titleMatch = md.match(/^#\s*Decision Report\s*\((\d{8})\)/im);
      if (titleMatch) out.report_date = titleMatch[1];

      return out;
    }

    function parseMarkdownTable(md, sectionTitle) {
      const escaped = sectionTitle.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      const re = new RegExp(`##\\s+${escaped}\\s*\\n([\\s\\S]*?)(?=\\n##\\s+|$)`, "i");
      const block = md.match(re);
      if (!block) return null;

      const lines = block[1]
        .split(/\n/)
        .map(s => s.trim())
        .filter(Boolean)
        .filter(s => s.startsWith("|"));

      if (lines.length < 2) return null;

      const header = splitTableRow(lines[0]);
      const body = lines
        .slice(2)
        .map(splitTableRow)
        .filter(row => row.length > 0);

      return { header, body };
    }

    function splitTableRow(line) {
      return String(line)
        .trim()
        .replace(/^\|/, "")
        .replace(/\|$/, "")
        .split("|")
        .map(s => s.trim());
    }

    function renderMarkdownTable(lines, startIndex) {
      const header = splitTableRow(lines[startIndex]);
      let i = startIndex + 1;

      if (i < lines.length && /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(lines[i])) {
        i += 1;
      }

      const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) {
        rows.push(splitTableRow(lines[i]));
        i += 1;
      }

      const numericNames = new Set(["rank", "weight", "ev", "p_fill", "e_ret", "cost", "riskpenalty"]);
      const keys = header.map(h => h.trim().toLowerCase());

      const thead = header.map((h, idx) => {
        const cls = numericNames.has(keys[idx]) ? ' class="num"' : "";
        return `<th${cls}>${inlineMd(h)}</th>`;
      }).join("");

      const tbody = rows.map(row => {
        const cells = header.map((_, idx) => {
          const val = row[idx] ?? "";
          const key = keys[idx];
          const cls = [
            numericNames.has(key) ? "num" : "",
            (key === "ev" || key === "e_ret") ? classForSigned(val) : ""
          ].filter(Boolean).join(" ");
          return `<td${cls ? ` class="${cls}"` : ""}>${inlineMd(val)}</td>`;
        }).join("");
        return `<tr>${cells}</tr>`;
      }).join("");

      return {
        html: `<div class="table-wrap"><table><thead><tr>${thead}</tr></thead><tbody>${tbody}</tbody></table></div>`,
        nextIndex: i
      };
    }

    function renderMarkdown(md) {
      const lines = normalizeMarkdown(md).split(/\n/);
      const html = [];
      let listOpen = false;

      function closeList() {
        if (listOpen) {
          html.push("</ul>");
          listOpen = false;
        }
      }

      for (let i = 0; i < lines.length;) {
        const line = lines[i].trim();

        if (!line) {
          closeList();
          i += 1;
          continue;
        }

        if (/^\|/.test(line) && i + 1 < lines.length && /\|?\s*:?-{3,}:?\s*\|/.test(lines[i + 1])) {
          closeList();
          const table = renderMarkdownTable(lines, i);
          html.push(table.html);
          i = table.nextIndex;
          continue;
        }

        const h = line.match(/^(#{1,6})\s+(.*)$/);
        if (h) {
          closeList();
          const level = Math.min(h[1].length, 3);
          html.push(`<h${level}>${inlineMd(h[2])}</h${level}>`);
          i += 1;
          continue;
        }

        const li = line.match(/^-\s+(.*)$/);
        if (li) {
          if (!listOpen) {
            html.push("<ul>");
            listOpen = true;
          }
          html.push(`<li>${inlineMd(li[1])}</li>`);
          i += 1;
          continue;
        }

        closeList();
        html.push(`<p>${inlineMd(line)}</p>`);
        i += 1;
      }

      closeList();
      return html.join("\n");
    }

    function buildMetaCard(label, value, extraClass = "") {
      const val = value == null || value === "" ? "-" : String(value);
      return `
        <div class="meta-item">
          <div class="meta-label">${escapeHtml(label)}</div>
          <div class="meta-value ${extraClass}">${escapeHtml(val)}</div>
        </div>
      `;
    }

    function renderMeta(fields, topnRows, allRows) {
      metaGrid.innerHTML = [
        buildMetaCard("报告日期", fields.report_date || "-"),
        buildMetaCard("信号日", fields.signal_date || "-"),
        buildMetaCard("执行日", fields.exec_date || "-"),
        buildMetaCard("市场状态", fields.regime || "-"),
        buildMetaCard("风险预算", fields.risk_budget || "-"),
        buildMetaCard("输入模式", fields.input_mode || "-"),
        buildMetaCard("TopN 数量", topnRows != null ? String(topnRows) : "-"),
        buildMetaCard("候选池数量", allRows != null ? String(allRows) : "-"),
        buildMetaCard("P_fill 来源", fields.p_fill_pred_src || "-"),
        buildMetaCard("E_ret 来源", fields.eret_pred_src || "-"),
        buildMetaCard("FS 降级原因", fields.fs_degrade_reason || "none"),
        buildMetaCard("当前文件", currentFileName || "-")
      ].join("");
    }

    function updateNavButtons() {
      prevBtn.disabled = currentIndex >= reportFiles.length - 1;
      nextBtn.disabled = currentIndex <= 0;
    }

    async function getReportFilesFromApi() {
      const files = await fetchJson(API_LIST_URL);
      const rows = Array.isArray(files) ? files : [];

      return rows
        .filter(x => x && x.type === "file" && /^decision_report_\d{8}\.md$/.test(x.name))
        .sort((a, b) => b.name.localeCompare(a.name))
        .map(x => ({
          name: x.name,
          path: x.path,
          rawUrl: x.download_url || `${RAW_BASE}/${x.path}`
        }));
    }

    function getFallbackReportFiles() {
      return getDateCandidates(45).map(ymd => ({
        name: `decision_report_${ymd}.md`,
        path: `${REPO.reportDir}/decision_report_${ymd}.md`,
        rawUrl: `${RAW_BASE}/${REPO.reportDir}/decision_report_${ymd}.md`
      }));
    }

    async function ensureReportList() {
      if (reportFiles.length > 0) return;

      /*
       * 优先使用 GitHub API，这样上一份/下一份按钮最完整。
       * 如果 API 被限流或网络拦截，立即切到 raw 日期回退，不让页面卡死。
       */
      try {
        setStatus("", "正在通过 GitHub API 定位报告列表...");
        reportFiles = await getReportFilesFromApi();
        lastLoadMode = "api-list";
      } catch (err) {
        console.warn("GitHub API list failed, fallback to raw date probing.", err);
        reportFiles = getFallbackReportFiles();
        lastLoadMode = "raw-date-fallback";
      }

      if (!reportFiles.length) {
        reportFiles = getFallbackReportFiles();
        lastLoadMode = "raw-date-fallback";
      }
    }

    async function loadReportByIndex(index) {
      try {
        await ensureReportList();

        currentIndex = Math.max(0, Math.min(index, reportFiles.length - 1));
        updateNavButtons();

        reportBox.className = "markdown empty";
        reportBox.innerHTML = "正在加载...";
        metaGrid.innerHTML = "";

        let lastErr = null;

        for (let i = currentIndex; i < reportFiles.length; i += 1) {
          const info = reportFiles[i];
          currentIndex = i;
          currentFileName = info.name;
          updateNavButtons();

          try {
            setStatus(lastLoadMode === "raw-date-fallback" ? "warn" : "", `正在读取：${info.name}`);
            const mdRaw = await fetchText(info.rawUrl);
            const md = normalizeMarkdown(mdRaw);

            const fields = extractSimpleFields(md);
            const topnTable = parseMarkdownTable(md, "TopN Targets");
            const allTable = parseMarkdownTable(md, "Full Candidate Pool");

            renderMeta(fields, topnTable?.body?.length ?? null, allTable?.body?.length ?? null);

            const html = renderMarkdown(md);
            reportBox.className = "markdown";
            reportBox.innerHTML = `
              ${lastLoadMode === "raw-date-fallback" ? '<div class="notice">提示：当前使用 raw 日期回退模式，说明 GitHub API 列表读取失败或被限流；正文读取已恢复。</div>' : ""}
              ${html}
            `;

            setStatus("ok", `加载成功：${info.name}（${currentIndex + 1}/${reportFiles.length}）`);
            footerText.textContent = `Top10 Decision · ${info.name} · 最近刷新：${new Date().toLocaleString("zh-CN")}`;
            return;
          } catch (err) {
            lastErr = err;
            console.warn(`Report not loaded: ${info.name}`, err);
            if (lastLoadMode !== "raw-date-fallback") break;
          }
        }

        throw lastErr || new Error("未找到可读取的 decision_report_YYYYMMDD.md");
      } catch (err) {
        console.error(err);
        setStatus("bad", "页面加载失败");
        reportBox.className = "markdown error";
        reportBox.innerHTML = `
          <strong>页面加载失败</strong><br><br>
          ${escapeHtml(err?.message || String(err))}<br><br>
          请检查：<br>
          1. 仓库是否公开；<br>
          2. outputs/decision/ 下是否已有 decision_report_YYYYMMDD.md；<br>
          3. 当前日期附近是否存在最新报告，例如 outputs/decision/decision_report_YYYYMMDD.md；<br>
          4. GitHub raw 或 GitHub API 是否临时限流。
        `;
        metaGrid.innerHTML = "";
      }
    }

    refreshBtn.addEventListener("click", () => {
      reportFiles = [];
      currentIndex = 0;
      loadReportByIndex(0);
    });

    prevBtn.addEventListener("click", () => loadReportByIndex(currentIndex + 1));
    nextBtn.addEventListener("click", () => loadReportByIndex(currentIndex - 1));

    async function init() {
      setStatus("", "正在定位报告...");
      await loadReportByIndex(0);
    }

    window.addEventListener("error", event => {
      console.error("Global page error:", event.error || event.message);
      setStatus("bad", "页面脚本异常");
      reportBox.className = "markdown error";
      reportBox.innerHTML = `
        <strong>页面脚本异常</strong><br><br>
        ${escapeHtml(event.message || "未知脚本错误")}<br><br>
        此版本已去除外部 Markdown CDN。如果仍异常，请检查浏览器控制台或 GitHub Pages 缓存。
      `;
    });

    init();
    setInterval(() => loadReportByIndex(currentIndex), 5 * 60 * 1000);
  </script>
</body>
</html>
